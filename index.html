<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0E1E3A" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>PROMAXIS — Promotional Sales &amp; Target Suite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   PROMAXIS — Design tokens
   Ink Navy   #0E1E3A  (sidebar / dark surfaces)
   Deep Indigo#16294F  (panels on dark)
   Signal Teal#0FB5A6  (primary accent / actions)
   Amber Brass#D8A13E  (secondary accent / targets)
   Alert Coral#E5484D  (duplicates / danger)
   Paper      #F6F7FB  (app background)
   Ink Text   #1B2340
   ========================================================= */
:root{
  --navy:#0E1E3A;
  --navy-2:#16294F;
  --navy-3:#1E3563;
  --heading:#0E1E3A;
  --accent:#0FB5A6;
  --accent-dark:#0B8F84;
  --brass:#D8A13E;
  --brass-dark:#B9832A;
  --coral:#E5484D;
  --coral-bg:#FDEBEC;
  --paper:#F6F7FB;
  --card:#FFFFFF;
  --ink:#1B2340;
  --ink-soft:#5B6584;
  --line:#E3E6F0;
  --radius:10px;
  --shadow:0 2px 10px rgba(14,30,58,.06), 0 1px 2px rgba(14,30,58,.08);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', -apple-system, Segoe UI, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:.2px;}
button{font-family:inherit;}
::selection{background:var(--accent); color:#fff;}
:focus-visible{outline:2.5px solid var(--brass); outline-offset:2px;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:270px; min-width:270px;
  background:linear-gradient(180deg, var(--navy) 0%, #0A1730 100%);
  color:#EAF0FF;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  transition:margin-left .25s ease;
}
.sidebar.collapsed{ margin-left:-270px; }
.brand{
  display:flex; align-items:center; gap:10px;
  padding:22px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{flex:none; display:flex;}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.5px;}
.brand-sub{font-size:10.5px; color:#9FB0D6; text-transform:uppercase; letter-spacing:1.2px; margin-top:2px;}

.nav-tree{flex:1; padding:14px 10px 20px;}
.nav-group{margin-bottom:4px;}
.nav-group > summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; border-radius:8px;
  font-size:12.5px; font-weight:600; color:#B9C6E8;
  text-transform:uppercase; letter-spacing:.8px;
  user-select:none;
}
.nav-group > summary::-webkit-details-marker{display:none;}
.nav-group > summary:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-group > summary .chev{transition:transform .18s ease; font-size:10px;}
.nav-group[open] > summary .chev{transform:rotate(90deg);}
.nav-sub{padding:2px 0 8px 4px;}
.nav-link{
  display:flex; align-items:center; gap:9px;
  padding:9px 12px; margin:1px 4px; border-radius:8px;
  color:#D3DCF2; text-decoration:none; font-size:13.5px;
  cursor:pointer; border:none; background:none; width:calc(100% - 8px); text-align:left;
}
.nav-link .dot{width:5px; height:5px; border-radius:50%; background:#5B6DA0; flex:none;}
.nav-link:hover{background:rgba(255,255,255,.07); color:#fff;}
.nav-link.active{background:var(--accent); color:#062A26; font-weight:600;}
.nav-link.active .dot{background:#062A26;}
.nav-top{
  display:flex; align-items:center; gap:9px;
  padding:10px 12px; margin:1px 4px 6px; border-radius:8px;
  color:#EAF0FF; font-size:13.5px; font-weight:600; cursor:pointer; border:none; background:none; width:calc(100% - 8px); text-align:left;
}
.nav-top:hover{background:rgba(255,255,255,.07);}
.nav-top.active{background:var(--navy-3);}

.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.08);}
.version-pill{
  display:inline-block; font-family:var(--font-mono); font-size:11px;
  color:#9FB0D6; background:rgba(255,255,255,.06); padding:4px 9px; border-radius:20px;
}

/* ---------- Main column ---------- */
.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:64px; flex:none; display:flex; align-items:center; gap:14px;
  padding:0 24px; background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
  overflow:hidden; /* keep long titles from spilling onto the page below */
}
.icon-btn{
  border:1px solid var(--line); background:var(--card); width:36px; height:36px; border-radius:8px;
  cursor:pointer; font-size:16px; color:var(--ink); flex:none;
}
.icon-btn:hover{background:var(--paper);}
.view-title{
  font-size:20px; font-weight:600; color:var(--heading);
  flex:1; min-width:0; /* critical: allow flex child to shrink */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.25;
}
.topbar-right{display:flex; align-items:center; gap:14px; flex:none; max-width:48%;}
.topbar-right .session-badge,
.topbar-right .autosave-badge,
.topbar-right .clock{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.clock{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft);}
.autosave-badge{font-size:11px; font-weight:600; color:var(--accent-dark); background:#E4F8F3; padding:4px 9px; border-radius:20px;}
.session-badge{font-size:11px; font-weight:600; color:var(--heading); background:var(--paper); border:1px solid var(--line); padding:4px 9px; border-radius:20px;}

.view{padding:26px 28px 60px; max-width:1400px; margin:0 auto; width:100%;}

/* ---------- Generic building blocks ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px;
}
.card + .card{margin-top:16px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.section-head h2{font-size:17px; color:var(--heading);}
.eyebrow{
  font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--accent-dark);
  font-weight:700; margin-bottom:4px; display:block;
}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

/* Stat / business cards */
.stat-card{
  background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
  color:#fff; border-radius:var(--radius); padding:18px 18px 16px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); cursor:pointer; border:none; text-align:left;
}
.stat-card:hover{outline:2px solid var(--brass);}
.stat-card .eyebrow{color:#8FE3D8;}
.stat-card .stat-value{font-family:var(--font-display); font-size:28px; font-weight:700; margin:2px 0 2px;}
.stat-card .stat-label{font-size:12px; color:#B9C6E8;}
.biz-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:10px; text-align:left;
}
.biz-card:hover{border-color:var(--accent);}
.biz-card .biz-name{font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--heading);}
.biz-card .biz-meta{font-size:12px; color:var(--ink-soft);}
.biz-card .biz-actions{display:flex; gap:8px; margin-top:4px;}

/* Target ring — signature element */
.ring-wrap{display:flex; align-items:center; gap:12px;}
.ring{
  --pct:0;
  width:64px; height:64px; border-radius:50%; flex:none;
  background:conic-gradient(var(--accent) calc(var(--pct)*1%), #E7EBF5 0);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.ring::after{content:''; position:absolute; inset:7px; border-radius:50%; background:var(--card);}
.ring span{position:relative; font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--heading);}
.ring.small{width:42px; height:42px;}
.ring.small::after{inset:5px;}
.ring.small span{font-size:9.5px;}
.ring.ring-lg{width:104px; height:104px;}
.ring.ring-lg::after{inset:11px;}
.ring.ring-lg span{font-size:20px;}

/* Dashboard hero banner */
.hero-banner{
  background:linear-gradient(120deg, var(--navy) 0%, var(--navy-3) 55%, var(--accent-dark) 130%);
  color:#fff; border-radius:var(--radius); padding:26px 30px; margin-bottom:22px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.hero-banner::before{content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.06);}
.hero-banner::after{content:''; position:absolute; left:40%; bottom:-90px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,0.05);}
.hero-eyebrow{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#8FE3D8; font-weight:600;}
.hero-title{font-family:var(--font-display); font-size:32px; font-weight:700; margin:4px 0 4px; position:relative;}
.hero-sub{font-size:13px; color:#C7D3F0; position:relative;}
.hero-ring{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;}
.hero-ring-label{font-size:11px; color:#C7D3F0;}
.stat-card-accent{background:linear-gradient(160deg, var(--accent-dark) 0%, var(--navy-2) 100%);}
.biz-card-deco{position:relative;}
.biz-card-icon{font-size:22px; line-height:1; display:flex; align-items:center; justify-content:flex-start; min-height:40px;}
.biz-logo{display:block; border-radius:8px; background:var(--paper); padding:4px; box-sizing:border-box;}
.biz-logo-wide{background:transparent; padding:2px 0;}
.biz-logo-fallback{
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:10px; background:linear-gradient(135deg, var(--navy), var(--navy-3));
  color:#fff; font-family:var(--font-display); font-weight:700; letter-spacing:0.02em;
}
/* Soft transitions for a more polished feel */
.biz-card, .stat-card, .card, .btn, .theme-pack-card, .nav-item{
  transition: border-color .18s ease, box-shadow .18s ease, transform .15s ease, background .18s ease;
}
.biz-card:hover, .stat-card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(14,30,58,.08);}
.btn:active{transform:scale(0.97);}

/* ── v4.4 polish: animations, skeleton, confetti, glass ── */
@keyframes fadeSlideIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(15,181,166,.35); }
  50%      { box-shadow: 0 0 0 10px rgba(15,181,166,0); }
}
@keyframes countPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
#view.view-enter { animation: fadeSlideIn .28s ease both; }
.skeleton {
  background: linear-gradient(90deg, var(--paper) 25%, var(--line) 50%, var(--paper) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s ease-in-out infinite;
  border-radius: 8px;
  color: transparent !important;
  pointer-events: none;
  min-height: 14px;
}
.skeleton-card { height: 120px; margin-bottom: 12px; }
.skeleton-stat { height: 88px; }
.confetti-root {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden;
}
.confetti-piece {
  position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px;
  animation: confettiFall linear forwards;
}
.ring {
  transition: --pct .8s ease;
}
.ring.achieved {
  animation: pulseGlow 1.6s ease 2;
  background: conic-gradient(var(--accent) 100%, var(--accent) 0) !important;
}
.stat-value.counting { animation: countPop .35s ease; }
/* Glass-ish cards on hero adjacent stats */
.stat-card {
  backdrop-filter: blur(6px);
}
.stat-card-accent {
  background: linear-gradient(145deg, var(--navy) 0%, var(--navy-3) 55%, var(--accent-dark) 140%) !important;
  color: #fff;
  border: none;
}
.stat-card-accent .eyebrow,
.stat-card-accent .stat-label { color: rgba(255,255,255,.72) !important; }
.stat-card-accent .stat-value { color: #fff !important; }
/* Refined empty states */
.empty-state {
  text-align: center;
  padding: 40px 24px;
  color: var(--ink-soft);
  background: linear-gradient(180deg, var(--paper) 0%, var(--card) 100%);
  border-radius: var(--radius);
  border: 1px dashed var(--line);
}
.empty-state .empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: .75;
  line-height: 1;
}
.empty-state .empty-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 16px;
  color: var(--heading);
  margin-bottom: 6px;
}
.empty-state .empty-desc { font-size: 13px; line-height: 1.45; max-width: 320px; margin: 0 auto; }
/* Better progress bar for promo cards */
.promo-bar {
  transition: width .7s cubic-bezier(.22,1,.36,1);
}
/* Focus ring polish */
.btn:focus-visible, .biz-card:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Empty state polish */
.empty-state{
  text-align:center; padding:36px 20px; color:var(--ink-soft);
  background:var(--paper); border-radius:var(--radius); border:1px dashed var(--line);
}
.empty-state .empty-icon{font-size:32px; margin-bottom:10px; opacity:.7;}
.empty-state .empty-title{font-family:var(--font-display); font-weight:600; color:var(--heading); margin-bottom:4px;}


/* Promotional Sales account cards — beautified without a target/% framing */
.promo-acct-card{background:linear-gradient(165deg, #fff 0%, #F6FBFA 100%);}
.promo-acct-top{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
.acct-avatar{
  flex:none; width:40px; height:40px; border-radius:50%;
  background:linear-gradient(140deg, var(--navy) 0%, var(--accent-dark) 100%);
  color:#fff; font-family:var(--font-display); font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.acct-rank-badge{font-size:11px; color:var(--ink-soft); font-weight:600;}
.promo-bar-wrap{height:7px; border-radius:5px; background:var(--paper); overflow:hidden; margin:6px 0 8px;}
.promo-bar{height:100%; border-radius:5px; background:linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);}

/* Print preview (plain HTML, no PDF plugin required) */
.pp-paper{background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; max-height:68vh; overflow-y:auto;}
.pp-brand{display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--navy); margin-bottom:14px; padding-bottom:10px;}
.pp-wordmark{font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--heading);}
.pp-title{font-size:13px; color:var(--ink); font-weight:600; margin-bottom:12px;}
.report-card{margin-bottom:18px;}
.report-card .section-head h2{display:flex; align-items:center; gap:8px;}
.all-acct-block{margin-top:20px; padding-top:18px; border-top:2px solid var(--line);}
.all-acct-name{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--heading); margin-bottom:8px;}

/* ---------- Toolbar / buttons ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px;}
.toolbar .spacer{flex:1;}
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:transform .05s ease, background .15s ease;
}
.btn:hover{background:var(--paper);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
.btn-accent{background:var(--brass); border-color:var(--brass); color:#3A2A05;}
.btn-accent:hover{background:var(--brass-dark);}
.btn-danger{background:#fff; border-color:var(--coral); color:var(--coral);}
.btn-danger:hover{background:var(--coral-bg);}
.btn-danger.solid{background:var(--coral); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn-ghost:hover{background:var(--paper); color:var(--ink);}
.btn-sm{padding:6px 10px; font-size:12px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.search-box{
  display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:0 10px; height:36px; min-width:210px;
}
.search-box input{border:none; outline:none; font-size:13px; width:100%; background:transparent;}
.search-box .ic{color:var(--ink-soft); font-size:13px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);}
table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table thead th{
  position:sticky; top:0; background:var(--navy); color:#EAF0FF; text-align:left;
  padding:11px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap;
  font-weight:600;
}
table.data-table tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--ink);}
table.data-table tbody tr:hover{background:#F5FAFA;}
table.data-table tbody tr.row-duplicate{background:var(--coral-bg);}
table.data-table tbody tr.row-duplicate:hover{background:#FBDBDC;}
table.data-table tbody tr.row-flash{animation:flash 1.1s ease 2;}
@keyframes flash{ 0%,100%{background:#FFF3D6;} 50%{background:#FFE4A0;} }
.mono{font-family:var(--font-mono); font-size:12.5px;}
.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.pill-dup{background:var(--coral); color:#fff;}
.pill-ok{background:#E4F8F3; color:var(--accent-dark);}
.pill-pending{background:#FFF3D6; color:#8A6300;}
.pill-approved{background:#DCEBFF; color:#1F4D9E;}
.pill-paid{background:#E4F8F3; color:var(--accent-dark);}
.pill-cancelled{background:#FBE1E1; color:#B03A3A;}
.badge-count{background:var(--navy-2); color:#fff; font-family:var(--font-mono); font-size:11px; padding:2px 7px; border-radius:6px;}

.empty-state{padding:44px 20px; text-align:center; color:var(--ink-soft);}
.empty-state .big{font-family:var(--font-display); font-size:18px; color:var(--heading); margin-bottom:6px;}

/* ---------- Forms ---------- */
label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
input[type=text], input[type=date], input[type=number], input[type=email], select, textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  font-size:13.5px; font-family:inherit; color:var(--ink); background:var(--card);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent);}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.field-row-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); font-weight:500;}
td.sel-cell, th.sel-cell{width:40px; text-align:center; cursor:pointer; padding:0;}
td.sel-cell input, th.sel-cell input{width:19px; height:19px; cursor:pointer; vertical-align:middle;}
.checkbox-row input{width:auto;}

/* ---------- Modal ---------- */
.modal-root{position:fixed; inset:0; z-index:100; pointer-events:none;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(9,17,36,.55); display:flex; align-items:flex-start; justify-content:center;
  padding:5vh 16px; overflow-y:auto; pointer-events:auto;
}
.modal{
  background:var(--card); border-radius:14px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(9,17,36,.35);
  animation:pop .15s ease;
}
.modal.modal-wide{max-width:920px;}
@keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:17px; color:var(--heading);}
.modal-body{padding:20px 22px; max-height:64vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
.modal-close{border:none; background:none; font-size:18px; cursor:pointer; color:var(--ink-soft); width:30px; height:30px; border-radius:6px;}
.modal-close:hover{background:var(--paper);}

/* product-row list inside sales entry modal */
.prod-row{display:grid; grid-template-columns:2fr 1.3fr .8fr 32px; gap:8px; align-items:end; margin-bottom:8px;}
.prod-row .mini-label{font-size:10.5px; color:var(--ink-soft); margin-bottom:3px;}
.prod-row-remove{border:none; background:var(--coral-bg); color:var(--coral); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px;}
.prod-total-line{display:flex; justify-content:space-between; padding:10px 4px; font-weight:700; color:var(--heading); border-top:1px dashed var(--line); margin-top:6px;}

/* ---------- Filters panel ---------- */
.filter-panel{display:none; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px;}
.filter-panel.open{display:block;}
.filter-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px;}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; max-height:120px; overflow-y:auto; padding:8px; border:1px solid var(--line); border-radius:8px;}
.chip{
  display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:20px;
  padding:5px 10px; font-size:12px; cursor:pointer; user-select:none;
}
.chip input{width:auto; margin:0;}
.chip.checked{background:var(--accent); color:#fff; border-color:var(--accent);}

/* ---------- Summary / duplicate panel ---------- */
.summary-row{display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px;}
.summary-row:hover{background:var(--paper);}
.summary-row .sr-info{display:flex; gap:16px; font-family:var(--font-mono); font-size:12px; color:var(--ink);}

/* ---------- Toasts ---------- */
.toast-root{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--navy); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px;
  box-shadow:0 8px 24px rgba(9,17,36,.3); display:flex; align-items:center; gap:8px;
  animation:toastIn .18s ease;
}
.toast.success{background:var(--accent-dark);}
.toast.danger{background:var(--coral);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Settings swatches ---------- */
.theme-pack-card{
  text-align:left; background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
  padding:14px; cursor:pointer; transition:border-color .15s;
}
.theme-pack-card:hover{border-color:var(--accent);}
.theme-pack-card.active{border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,181,166,.15);}
.theme-pack-swatches{display:flex; gap:6px; margin-bottom:10px;}
.theme-pack-swatches span{width:22px; height:22px; border-radius:50%; display:inline-block;}
.theme-pack-name{font-family:var(--font-display); font-weight:700; font-size:14.5px; color:var(--heading); margin-bottom:3px;}
.theme-pack-desc{font-size:11.5px; color:var(--ink-soft); line-height:1.4;}
.swatch.active{box-shadow:0 0 0 2px var(--navy);}

/* ---------- Backup list ---------- */
.backup-item{display:flex; align-items:center; justify-content:space-between; padding:12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px;}
.backup-item .bi-meta{font-size:12px; color:var(--ink-soft);}

/* ---------- Print ---------- */
@media print{
  .sidebar, .topbar, .toolbar, .modal-root, .toast-root, .filter-panel, .nav-tree{display:none !important;}
  body, .view{background:#fff !important; padding:0; margin:0;}
  .main-col{margin:0;}
  .card{box-shadow:none; border:none;}
  table.data-table thead th{background:#0E1E3A !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; color:#fff !important;}
  tr.row-duplicate{background:#FDEBEC !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
}

/* ---------- Utility ---------- */
.text-soft{color:var(--ink-soft);}
.mt-0{margin-top:0;}
.mb-0{margin-bottom:0;}
.right{text-align:right;}
.hidden{display:none !important;}
.kbd{font-family:var(--font-mono); font-size:11px; background:var(--paper); border:1px solid var(--line); padding:1px 6px; border-radius:5px;}

/* ---------- App Lock ---------- */
.lock-screen{
  position:fixed; inset:0; z-index:9999;
  background:linear-gradient(120deg, var(--navy) 0%, var(--navy-3) 55%, var(--accent-dark) 130%);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.lock-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 30px; width:100%; max-width:380px;}
.lock-brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.lock-title{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--heading);}
.lock-sub{font-size:12px; color:var(--ink-soft);}
.lock-error{color:#D6455A; font-size:12.5px; margin:-6px 0 12px; min-height:16px;}
.lock-links{margin-top:14px; text-align:center; font-size:12.5px;}
.lock-links a{color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600;}
.lock-links a:hover{text-decoration:underline;}

.backup-reminder-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:#FFF4E1; border-bottom:1px solid #F0C36D; color:#7A4E00; padding:8px 18px; font-size:12.5px;}
.backup-reminder-bar .btn{padding:4px 10px; font-size:12px;}


/* ---------- v4.6 additions ---------- */
.sync-badge{font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; cursor:pointer; background:#E4F8F3; color:var(--accent-dark); white-space:nowrap;}
.sync-badge.warn{background:#FFF3D6; color:#8A6300;}
.sync-badge.bad{background:var(--coral-bg); color:var(--coral);}
.toast-undo{margin-left:12px; background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.6); border-radius:6px; padding:3px 12px; font-weight:700; cursor:pointer; font-size:12.5px;}
.toast-undo:hover{background:rgba(255,255,255,.35);}
.pill-warn{background:#FFF3D6; color:#8A6300;}
.pill-info{background:#DCEBFF; color:#1F4D9E;}
.hbars{display:flex; flex-direction:column; gap:10px;}
.hbar-row{display:grid; grid-template-columns:minmax(90px,32%) 1fr auto; gap:10px; align-items:center; font-size:13px;}
.hbar-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
.hbar-sub{display:block; font-size:11px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis;}
.hbar-track{background:var(--paper); border-radius:6px; height:14px; overflow:hidden; border:1px solid var(--line);}
.hbar-fill{height:100%; background:var(--accent); border-radius:5px;}
.hbar-fill.ok{background:#2FA84F;}
.hbar-val{font-family:var(--font-mono); font-size:12px; white-space:nowrap; color:var(--ink);}
.chart-legend{display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin-bottom:6px; flex-wrap:wrap;}
.chart-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
.pace-bar{position:relative; height:16px; background:var(--paper); border:1px solid var(--line); border-radius:9px; margin:8px 0 6px;}
.pace-fill{height:100%; background:var(--accent); border-radius:9px;}
.pace-fill.ok{background:#2FA84F;}
.pace-mark{position:absolute; top:-5px; width:3px; height:24px; background:var(--coral); border-radius:2px;}
.pace-legend{font-size:12px; margin-bottom:12px;}
.pace-stats{gap:10px;}
.pace-num{font-family:var(--font-display); font-size:17px; color:var(--heading); margin:2px 0;}
.total-calc{font-size:12.5px; color:var(--ink-soft); margin-top:5px;}
.total-calc .calc-warn{color:var(--coral); font-weight:600; margin-top:3px;}
.slab-row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; font-size:13px;}
.slab-row input[type=number]{width:96px;}
@media (max-width:700px){ .pace-stats{grid-template-columns:1fr 1fr !important;} .hbar-row{grid-template-columns:minmax(70px,38%) 1fr; } .hbar-val{grid-column:1/-1; margin-top:-6px;} }
</style>

/* ---------------- Storage layer ----------------
   Every business's real data (sales memos, products, targets, settings)
   is kept in IndexedDB, not localStorage — localStorage caps out around
   5-10MB per browser and would eventually refuse to save new memos with
   no warning. IndexedDB uses a share of the device's actual free disk
   space instead (realistically hundreds of MB up to a few GB), so this
   removes that ceiling.

   Store.get/Store.set below keep the EXACT same synchronous signatures
   the rest of the app already calls everywhere — nothing else changes.
   This works by keeping a plain in-memory cache (_cache) that's loaded
   once from IndexedDB right before the app boots (see boot() at the very
   bottom of this file); Store.get reads that cache instantly, and
   Store.set updates it instantly AND writes the change through to
   IndexedDB in the background. A legacy copy is also mirrored into
   localStorage on every write, best-effort — harmless once data outgrows
   it (the write is simply skipped), but a free extra safety net while it
   still fits, and the fallback path if a browser has no IndexedDB at all
   (e.g. some private-browsing modes). On first run after this update,
   whatever was already saved under localStorage is copied into
   IndexedDB automatically, once, so no existing data is lost. */
const LS_PREFIX = "promaxis_";
const IDB_NAME = "promaxis_db";
const IDB_STORE = "kv";
const _idbSupported = typeof indexedDB !== 'undefined';
let _idbHandle = null;
let _cache = {};
function openIDB(){
  if(_idbHandle) return Promise.resolve(_idbHandle);
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'key'});
    };
    req.onsuccess = e=>{ _idbHandle = e.target.result; resolve(_idbHandle); };
    req.onerror = e=>reject(e.target.error);
  });
}
function idbGetAll(){
  return openIDB().then(db=>new Promise((resolve, reject)=>{
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = e=>reject(e.target.error);
  }));
}
function idbPut(key, value){
  return openIDB().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({key, value});
    tx.oncomplete = resolve;
    tx.onerror = e=>reject(e.target.error);
  }));
}
function idbDelete(key){
  return openIDB().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = resolve;
    tx.onerror = e=>reject(e.target.error);
  }));
}
function idbClearAll(){
  return openIDB().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = resolve;
    tx.onerror = e=>reject(e.target.error);
  }));
}
/* One-time migration: if IndexedDB has nothing yet but localStorage (from
   before this update) does, copy it all across before the app starts. */
function migrateLegacyLocalStorage(){
  if(!_idbSupported) return Promise.resolve();
  return idbGetAll().then(existing=>{
    if(existing.length>0) return;
    const puts = [];
    for(let i=0;i<localStorage.length;i++){
      const fullKey = localStorage.key(i);
      if(fullKey && fullKey.indexOf(LS_PREFIX)===0){
        try{ puts.push(idbPut(fullKey.slice(LS_PREFIX.length), JSON.parse(localStorage.getItem(fullKey)))); }
        catch(e){ /* skip an unreadable legacy key rather than fail the whole migration */ }
      }
    }
    return Promise.all(puts);
  }).catch(()=>{ /* IndexedDB unavailable — app still works via the localStorage fallback below */ });
}
function hydrateCache(){
  if(!_idbSupported) return Promise.resolve();
  return idbGetAll().then(rows=>{ rows.forEach(r=>{ _cache[r.key] = r.value; }); }).catch(()=>{});
}
/* Keys that belong to THIS device only — they are never synced to the cloud. */
const LOCAL_ONLY_RE = /^(sync_|autobak_|last_backup_at$|sales_filter_|product_filter_|report_summary_filter$|wa_sent_|app_password$)/;
const isLocalOnlyKey = k => LOCAL_ONLY_RE.test(k);
const NO_MIRROR_RE = /^(sync_|autobak_)/;   /* big/derived keys: skip the localStorage mirror */
const Store = {
  onChange: null,
  get(key, def){
    if(Object.prototype.hasOwnProperty.call(_cache, key)) return _cache[key];
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      if(raw!==null) return JSON.parse(raw);
    }catch(e){}
    return def;
  },
  set(key, val){
    _cache[key] = val;
    if(_idbSupported) idbPut(key, val).catch(()=>toast('Could not save to device storage.', 'danger'));
    if(!NO_MIRROR_RE.test(key)){
      try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }
      catch(e){ /* fine — IndexedDB (or the in-memory cache) already has it; localStorage just can't fit this key anymore */ }
    }
    if(Store.onChange) Store.onChange(key);
  },
  del(key){
    delete _cache[key];
    if(_idbSupported) idbDelete(key).catch(()=>{});
    try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
    if(Store.onChange) Store.onChange(key);
  }
};

function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ---------------- App Lock (Settings → Security) ----------------
   v4.6: the password and the recovery key are never stored — or shipped
   inside this file — as plain text any more. Only a salted, stretched
   SHA-256 hash of each is kept (Store key "app_auth"), so reading the page
   source or the stored data no longer reveals either one.
   Honest limit: this is a browser-only app, so the lock keeps casual users
   out; it is not a substitute for server-side security. */
const PW_ITER = 3000;
const LEGACY_SALT = 'promaxis-legacy-v1';
const LEGACY_HASH = '1133ff621467d033541c75fdaf3cf12f5795148c042a06406e95a76437a2a8fe';   /* hash of the pre-4.6 built-in default, so existing users can still sign in once */
function pwHash(pw, salt){ let h = SHA256.hex(salt+'|'+pw); for(let i=0;i<PW_ITER;i++) h = SHA256.hex(h+salt); return h; }
function randHex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
const RK_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeRecoveryKey(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  let s = ''; a.forEach(b=>{ s += RK_ALPHABET[b % RK_ALPHABET.length]; });
  return s.match(/.{4}/g).join('-');
}
const normKey = k => String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function getAuth(){ return Store.get('app_auth', null); }
/* Saves a new password. keepFrom = an existing auth whose recovery key stays valid;
   without it a fresh recovery key is generated and RETURNED so it can be shown once. */
function setPasswordAndKey(pw, keepFrom){
  const salt = randHex(12);
  const auth = {v:1, salt, hash:pwHash(pw, salt), at:new Date().toISOString()};
  let newKey = null;
  if(keepFrom && keepFrom.rhash){ auth.rsalt = keepFrom.rsalt; auth.rhash = keepFrom.rhash; }
  else { newKey = makeRecoveryKey(); auth.rsalt = randHex(12); auth.rhash = pwHash(normKey(newKey), auth.rsalt); }
  Store.set('app_auth', auth);
  Store.del('app_password');
  return newKey;
}
function regenRecoveryKey(){
  const a = getAuth(); if(!a) return null;
  const key = makeRecoveryKey(), rsalt = randHex(12);
  Store.set('app_auth', {...a, rsalt, rhash:pwHash(normKey(key), rsalt), at:new Date().toISOString()});
  return key;
}
function verifyPassword(pw){
  const a = getAuth();
  if(a) return pwHash(pw, a.salt) === a.hash;
  const old = Store.get('app_password', null);          /* custom password set in a pre-4.6 version */
  if(old) return pw === old;
  return pwHash(pw, LEGACY_SALT) === LEGACY_HASH;       /* never changed: built-in default */
}
function verifyRecovery(key){
  const a = getAuth();
  if(a && a.rhash) return pwHash(normKey(key), a.rsalt) === a.rhash;
  return pwHash(String(key||'').trim(), LEGACY_SALT) === LEGACY_HASH;   /* pre-4.6 recovery key */
}
function isUnlocked(){ return sessionStorage.getItem(LS_PREFIX+'unlocked')==='1'; }
function unlockApp(){ sessionStorage.setItem(LS_PREFIX+'unlocked','1'); }
function lockAppNow(){ sessionStorage.removeItem(LS_PREFIX+'unlocked'); location.reload(); }

/* ---------------- Backup Reminder ----------------
   Every business's real sales data lives only in this browser's storage —
   there's no server. If it's never backed up (Back Up page → download or
   share a copy) and the browser data is ever cleared, it's gone for good.
   This nudges the owner to back up regularly instead of relying on memory. */
const BACKUP_REMINDER_DAYS = 3;
function getLastBackupAt(){ return Store.get('last_backup_at', null); }
function markBackupDone(){ Store.set('last_backup_at', new Date().toISOString()); updateBackupReminder(); }
function updateBackupReminder(){
  const bar = document.getElementById('backupReminderBar');
  if(!bar) return;
  if(sessionStorage.getItem(LS_PREFIX+'backup_reminder_dismissed')==='1'){ bar.style.display='none'; return; }
  const totalEntries = BUSINESSES.reduce((a,b)=>a+getSales(b.key).length, 0);
  if(totalEntries===0){ bar.style.display='none'; return; }
  const last = getLastBackupAt();
  let overdue = false, text = '';
  if(!last){
    overdue = true;
    text = 'No backup has been taken yet — back up your sales data now so it\'s never lost.';
  } else {
    const days = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
    if(days >= BACKUP_REMINDER_DAYS){
      overdue = true;
      text = `Last backup was ${days} day(s) ago — back up again to keep your data safe.`;
    }
  }
  bar.style.display = overdue ? 'flex' : 'none';
  if(overdue) document.getElementById('backupReminderText').textContent = text;
}

/* Decides whether one memo of a business counts toward THAT SAME business's
   Sales Target account/reports — based on that business's own Session
   Period (Settings → Session Period, configured per business):
   - No period set for this business → only memos entered directly on the
     Sales Target side (source==='target') count. Promotional Sales memos
     stay completely separate from Sales Target — and Sales Target memos
     stay completely separate from Promotional Sales, as always — until a
     period is set.
   - Period set → every memo (either side) dated inside it counts, so
     Promotional Sales memos in range are pulled into Sales Target too. */
function inTargetPeriod(bizKey, entry){
  const p = getSessionPeriod(bizKey);
  if(!p.from) return entry.source==='target';
  if(entry.date < p.from) return false;
  if(p.to && entry.date > p.to) return false;
  return true;
}

function diffList(key, list){
  const old = _shadow[key] || new Map(), ids = new Set(), added = [], changed = [], removed = [];
  list.forEach(r=>{
    ids.add(r.id);
    const o = old.get(r.id);
    if(o===undefined) added.push(r);
    else if(o !== JSON.stringify(r)) changed.push({old:JSON.parse(o), now:r});
  });
  old.forEach((json,id)=>{ if(!ids.has(id)) removed.push(JSON.parse(json)); });
  return {added, changed, removed};
}

function entryDiffText(o, n){
  const bits = [];
  if(o.memo!==n.memo) bits.push(`memo ${o.memo}→${n.memo}`);
  if(o.date!==n.date) bits.push(`date ${o.date}→${n.date}`);
  if(o.salesman!==n.salesman) bits.push(`salesman ${o.salesman}→${n.salesman}`);
  if((Number(o.total)||0)!==(Number(n.total)||0)) bits.push(`total ৳${numPlain(o.total)}→৳${numPlain(n.total)}`);
  if((o.contractor||'')!==(n.contractor||'')) bits.push(`contractor ${o.contractor||'—'}→${n.contractor||'—'}`);
  if(itemsSig(o.items)!==itemsSig(n.items)) bits.push('products changed');
  return bits.join('; ') || 'updated';
}
function prodDesc(p){ return `${p.productName||'?'} · ${p.modelNumber||'?'}`; }
function prodDiffText(o, n){
  const bits = [], f = (k,l)=>{ if((Number(o[k])||0)!==(Number(n[k])||0)) bits.push(`${l} ${numPlain(o[k])}→${numPlain(n[k])}`); };
  if(o.productName!==n.productName) bits.push(`name ${o.productName}→${n.productName}`);
  if(o.modelNumber!==n.modelNumber) bits.push(`model ${o.modelNumber}→${n.modelNumber}`);
  f('price','price'); f('quantity','stock'); f('targetQuantity','target qty'); f('spQty','salesperson promo'); f('ctQty','contractor promo'); f('minStock','low-stock level');
  return bits.join('; ') || 'updated';
}
function auditDiff(bizKey, d, kind, opts){
  const rows = [], L = 12;
  const desc = kind==='sale' ? entryDesc : prodDesc, dtx = kind==='sale' ? entryDiffText : prodDiffText;
  const noun = kind==='sale' ? 'memos' : 'products';
  if(opts.label && d.removed.length>1 && !d.added.length && !d.changed.length){
    rows.push({act:'clear', biz:bizKey, txt:`${opts.label} — ${d.removed.length} ${noun} moved to Recycle Bin`});
  } else {
    d.added.slice(0,L).forEach(r=>rows.push({act:'add', biz:bizKey, txt:desc(r)}));
    if(d.added.length>L) rows.push({act:'add', biz:bizKey, txt:`…and ${d.added.length-L} more ${noun} added`});
    d.changed.slice(0,L).forEach(c=>rows.push({act:'edit', biz:bizKey, txt:desc(c.now)+' — '+dtx(c.old, c.now)}));
    if(d.changed.length>L) rows.push({act:'edit', biz:bizKey, txt:`…and ${d.changed.length-L} more ${noun} edited`});
    d.removed.slice(0,L).forEach(r=>rows.push({act:'delete', biz:bizKey, txt:desc(r)+' → Recycle Bin'}));
    if(d.removed.length>L) rows.push({act:'delete', biz:bizKey, txt:`…and ${d.removed.length-L} more ${noun} deleted`});
  }
  auditAdd(rows);
}

/* ---------------- Recycle bin ---------------- */
const TRASH_KEEP_DAYS = 60;
function trashAdd(type, biz, recs, meta){
  const bin = Store.get('trash', []);
  const item = {id:uid(), ts:new Date().toISOString(), dev:deviceName(), type, biz, label:(meta&&meta.label)||'', stockRestored:!!(meta&&meta.stockRestored), recs};
  bin.push(item);
  while(bin.length > 400){ const gone = bin.shift(); tombAdd([gone.id]); }
  Store.set('trash', bin);
  return item.id;
}
function purgeOldTrash(){
  const bin = Store.get('trash', []), cut = Date.now() - TRASH_KEEP_DAYS*86400000;
  const keep = bin.filter(x=>new Date(x.ts).getTime() >= cut);
  if(keep.length !== bin.length){
    tombAdd(bin.filter(x=>!keep.includes(x)).map(x=>x.id));
    Store.set('trash', keep);
  }
  /* delete-markers older than 120 days are no longer needed */
  const t = Store.get('tomb', {}), tcut = Date.now() - 120*86400000; let pruned = false;
  Object.keys(t).forEach(id=>{ if(new Date(t[id]).getTime() < tcut){ delete t[id]; pruned = true; } });
  if(pruned) Store.set('tomb', t);
}
function restoreTrashItem(tid){
  const bin = Store.get('trash', []), it = bin.find(x=>x.id===tid);
  if(!it) return false;
  const recs = it.recs.map(r=>({...r, id:uid()}));   /* fresh ids, so a cloud delete-marker can never swallow the restored record */
  if(it.type==='sale'){
    const sm = getSalesmen(it.biz); let addedSm = false;
    recs.forEach(r=>{ if(r.salesman && !sm.includes(r.salesman)){ sm.push(r.salesman); addedSm = true; } });
    if(addedSm) saveSalesmen(it.biz, sm);
    saveSales(it.biz, getSales(it.biz).concat(recs), {noStock: !it.stockRestored, silent:true});
  } else {
    saveProducts(it.biz, getProducts(it.biz).concat(recs), {silent:true});
  }
  Store.set('trash', Store.get('trash', []).filter(x=>x.id!==tid));
  tombAdd([tid]);
  auditAdd([{act:'restore', biz:it.biz, txt:`Restored ${recs.length} ${it.type==='sale'?'memo(s)':'product(s)'} from Recycle Bin${it.label?' — '+it.label:''}`}]);
  return true;
}
function deleteTrashItem(tid){
  Store.set('trash', Store.get('trash', []).filter(x=>x.id!==tid));
  tombAdd([tid]);
}

function stockCfg(){ return Object.assign({auto:true, low:10, alerts:true}, Store.get('stock_cfg', {})); }
function productFor(products, it){
  let p = it.modelNumber ? products.find(x=>x.modelNumber===it.modelNumber) : null;
  if(!p && it.productName) p = products.find(x=>x.productName===it.productName);
  return p || null;
}
function accStock(prods, items, sign, map){
  (items||[]).forEach(it=>{
    const q = Number(it.qty)||0; if(!q) return;
    const p = productFor(prods, it); if(!p) return;
    map.set(p.id, (map.get(p.id)||0) + sign*q);
  });
}
function lowLevel(p){ return Number(p.minStock)>0 ? Number(p.minStock) : stockCfg().low; }
function isLowStock(p){ return (Number(p.quantity)||0) <= lowLevel(p); }
function stockApply(bizKey, prods, dm){
  const crossed = [];
  if(!dm.size) return crossed;
  prods.forEach(p=>{
    const d = dm.get(p.id); if(!d) return;
    const before = Number(p.quantity)||0, th = lowLevel(p);
    p.quantity = Math.round((before + d)*1000)/1000;
    if(d<0 && p.quantity <= th && before > th) crossed.push(p);
  });
  Store.set('products_'+bizKey, prods);
  _shadow['products_'+bizKey] = shadowMap(prods);   /* stock moves are bookkeeping, not an edit — kept out of audit/bin */
  return crossed;
}

function saveSales(bizKey, list, opts){
  opts = opts || {};
  const key = 'sales_'+bizKey;
  const d = diffList(key, list);
  Store.set(key, list);
  _shadow[key] = shadowMap(list);
  _lastTrashId = null;
  if(opts.skipFx) return;
  let stockRestored = false;
  if(!opts.noStock && stockCfg().auto){
    const prods = getProducts(bizKey), dm = new Map();
    d.added.forEach(e=>accStock(prods, e.items, -1, dm));
    d.changed.forEach(c=>{ accStock(prods, c.old.items, +1, dm); accStock(prods, c.now.items, -1, dm); });
    if(!opts.noStockRestore && d.removed.length){ d.removed.forEach(e=>accStock(prods, e.items, +1, dm)); stockRestored = true; }
    const crossed = stockApply(bizKey, prods, dm);
    if(crossed.length && stockCfg().alerts) toast('⚠ Low stock: '+crossed.slice(0,3).map(p=>`${p.productName} ${p.modelNumber} (${p.quantity} left)`).join(', ')+(crossed.length>3?` +${crossed.length-3} more`:''), 'danger');
  }
  if(d.removed.length){
    tombAdd(d.removed.map(r=>r.id));
    if(!opts.noTrash) _lastTrashId = trashAdd('sale', bizKey, d.removed, {label:opts.label, stockRestored});
  }
  if(!opts.silent) auditDiff(bizKey, d, 'sale', opts);
}

}
function lowStockList(){

  BUSINESSES.forEach(b=>getProducts(b.key).forEach(p=>{ if(isLowStock(p)) out.push({biz:b.key, p}); }));

}

/* ---------------- Contractor promo ----------------
   Product Details holds a per-unit promo amount for the Contractor (ctQty),
   just like the Salesperson one. A memo can optionally name its contractor,
   so promo can be totalled per contractor. */
function itemCtPromo(bizKey, item){
  const p = productFor(getProducts(bizKey), item);
  return p ? (Number(p.ctQty)||0) * (Number(item.qty)||0) : 0;
}
function entryCtPromo(bizKey, e){ return (e.items||[]).reduce((a,it)=>a+itemCtPromo(bizKey,it),0); }
function bizHasCtPromo(bizKey){ return getProducts(bizKey).some(p=>Number(p.ctQty)>0); }

/* ---------------- Target pace ---------------- */
function paceInfo(bizKey, achieved, target){
  const p = getSessionPeriod(bizKey), today = todayStr();
  if(!p.from) return {state:'noperiod'};
  if(!p.to) return {state:'noend'};
  const DAY = 86400000, d = s=>Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
  const total = Math.max(1, Math.round((d(p.to)-d(p.from))/DAY)+1);
  if(today < p.from) return {state:'notstarted', total};
  const ended = today > p.to;
  const elapsed = Math.min(total, Math.round((d(today)-d(p.from))/DAY)+1);
  const left = Math.max(0, total-elapsed);
  const projected = achieved/elapsed*total;
  return {state: ended?'ended':'running', total, elapsed, left, projected,
          projPct: pctOf(projected, target), expectedPct: Math.round(elapsed/total*100),
          perDay: left>0 ? Math.max(0, (target-achieved)/left) : 0};
}
function paceLabel(pc){
  if(pc.state==='noperiod') return 'Set a session period to see pace';
  if(pc.state==='noend') return 'Add a period end date to see pace';
  if(pc.state==='notstarted') return 'Period has not started yet';
  if(pc.state==='ended') return 'Period ended';
  return `On pace for ${pc.projPct}% by period end`;
}

/* ---------------- Incentive slabs ---------------- */
const DEFAULT_SLABS = [{pct:80,type:'percent',value:0.5},{pct:100,type:'percent',value:1},{pct:120,type:'percent',value:1.5}];
function incentiveCfg(){ return Object.assign({enabled:false, base:'sales', slabs:DEFAULT_SLABS, byBiz:{}}, Store.get('incentive_cfg', {})); }
function incentiveOn(){ return !!incentiveCfg().enabled; }
function getSlabs(bizKey){ const c = incentiveCfg(), s = (c.byBiz||{})[bizKey]; return (Array.isArray(s) && s.length) ? s : (c.slabs||DEFAULT_SLABS); }
function calcIncentive(bizKey, st){
  const c = incentiveCfg(); if(!c.enabled) return null;
  const slabs = getSlabs(bizKey).slice().sort((a,b)=>Number(a.pct)-Number(b.pct));
  let hit = null; slabs.forEach(s=>{ if(st.pct >= Number(s.pct)) hit = s; });
  if(!hit) return {amount:0, slab:null, next:slabs[0]||null};
  const base = c.base==='promo' ? st.periodPromo : st.periodTotal;
  const amount = hit.type==='fixed' ? (Number(hit.value)||0) : base*(Number(hit.value)||0)/100;
  return {amount, slab:hit, next:slabs[slabs.indexOf(hit)+1]||null};
}
function incText(inc){
  if(!inc) return '';
  if(!inc.slab) return inc.next ? `No slab yet (starts at ${inc.next.pct}%)` : '—';
  return `${fmtMoney(inc.amount)} (${inc.slab.pct}% slab)`;
}

function achievedQtyForProduct(bizKey, product){
  let sum = 0;
  getSales(bizKey).forEach(e=> (e.items||[]).forEach(it=>{ if(it.modelNumber===product.modelNumber) sum += Number(it.qty)||0; }));
  return sum;
}

/* ---------------- Per-account (salesman × business) targets ---------------- */
function getTargets(bizKey){ return Store.get('targets_'+bizKey, {}); }
function getTarget(bizKey, name){ const t = getTargets(bizKey); return (t[name]!=null) ? Number(t[name]) : DEFAULT_TARGET; }
function setTarget(bizKey, name, amount){ const t = getTargets(bizKey); t[name] = Number(amount)||0; Store.set('targets_'+bizKey, t); }

/* Promotional value of a single line item — qty × the product's per-unit
   promo amount (the "Promo — Salesperson" field on Product Details). */
function itemPromoAmount(bizKey, item){
  const products = getProducts(bizKey);
  /* Prefer an exact model match; if no model was picked for this line, fall
     back to the product name so the promo value is still added. */
  let prod = item.modelNumber ? products.find(p=>p.modelNumber===item.modelNumber) : null;
  if(!prod && item.productName) prod = products.find(p=>p.productName===item.productName);
  const perUnit = prod ? (Number(prod.spQty)||0) : 0;
  return perUnit * (Number(item.qty)||0);
}
function entryPromoAmount(bizKey, entry){
  return (entry.items||[]).reduce((a,it)=>a+itemPromoAmount(bizKey,it),0);
}
/* Full stats for one salesman's account within one business */
function inDateRange(entry, dateFrom, dateTo){
  if(dateFrom && entry.date < dateFrom) return false;
  if(dateTo && entry.date > dateTo) return false;
  return true;
}

function salesmanStats(bizKey, name, dateFrom, dateTo){
  const all = getSales(bizKey).filter(e=>e.salesman===name);
  /* Optional dateFrom/dateTo narrow which memos count — used by Report &
     Summary page filters. Individual account pages still call without dates. */
  const inRange = e => inDateRange(e, dateFrom, dateTo);
  /* Entries added from the Sales Target side (source:'target') only ever
     count toward Sales Target figures — they never feed into the
     Promotional Sales (all-time) totals below. Entries added from the
     Promotional Sales side (source:'promo', or no source on older data)
     count everywhere, same as before. */
  const promoOnly = all.filter(e=>e.source!=='target' && inRange(e));
  /* Promotional Sales (its own section) is tracked all-time (or within the
     Report/Summary date filter when set). Within Sales Target, entries are
     scoped to that business's own target period (Settings → Session Period)
     and produce TWO separate figures: Sales Target Achieve (the memos' full
     total amount — this is what the Achieve % is measured against) and
     Promotional Sales Target Achieve (just the promotional value of those
     same period memos) — shown side by side, not merged. Once a period is
     set, Sales Target period totals include every memo in the period
     regardless of which side it was entered from; until then, only memos
     entered directly on the Sales Target side count (see inTargetPeriod).
     A Report/Summary date filter further narrows those period memos. */
  const periodEntries = all.filter(e=>inTargetPeriod(bizKey, e) && inRange(e));
  const total = promoOnly.reduce((a,e)=>a+(Number(e.total)||0),0);
  const periodTotal = periodEntries.reduce((a,e)=>a+(Number(e.total)||0),0);
  const periodPromo = periodEntries.reduce((a,e)=>a+entryPromoAmount(bizKey,e),0);
  const promo = promoOnly.reduce((a,e)=>a+entryPromoAmount(bizKey,e),0);
  const promoQty = promoOnly.reduce((a,e)=>a+(e.items||[]).reduce((s2,it)=>s2+(Number(it.qty)||0),0),0);
  const target = getTarget(bizKey, name);
  const pct = target ? Math.round(periodTotal/target*100) : 0;
  const promoPct = target ? Math.round(periodPromo/target*100) : 0;
  const ctPromo = promoOnly.reduce((a,e)=>a+entryCtPromo(bizKey,e),0);
  const periodCtPromo = periodEntries.reduce((a,e)=>a+entryCtPromo(bizKey,e),0);
  const incentive = calcIncentive(bizKey, {pct, periodTotal, periodPromo});
  return {name, count:promoOnly.length, periodCount:periodEntries.length, total, periodTotal, periodPromo, promo, promoQty, target, pct, promoPct, ctPromo, periodCtPromo, incentive};
}
function allAccountStats(bizKey, dateFrom, dateTo){
  return getSalesmen(bizKey).map(name=>salesmanStats(bizKey, name, dateFrom, dateTo));
}
/* Report and Summary only ever list accounts with actual activity — an
   account showing exactly $0 (Total Sales in Promotional Sales mode, or
   Sales Target Achieve in Sales Target mode) is left out entirely, so a
   brand-new/empty account doesn't clutter these pages. This does NOT
   affect the main Sales Target / Promotional Sales account list pages,
   where seeing a $0 account is still needed to manage or enter for it. */
function reportableAccountStats(bizKey, mode, dateFrom, dateTo){
  const key = mode==='target' ? 'periodTotal' : 'total';
  return allAccountStats(bizKey, dateFrom, dateTo).filter(s=>s[key] > 0);
}
/* Aggregated promotional-product breakdown for one salesman: SL / Product Name / Model Number / Qty
   When mode==='target', only memos dated within the Sales Target period (Settings →
   Session Period) are counted — matching the period-scoped totals shown above this
   table in every Sales Target summary/report. Promotional Sales summaries keep
   using all-time data, since that section stays tracked all time. */
function productBreakdownForSalesman(bizKey, name, mode){
  let entries = getSales(bizKey).filter(e=>e.salesman===name);
  if(mode==='target'){
    entries = entries.filter(e=>inTargetPeriod(bizKey, e));
  } else {
    /* Promotional Sales breakdown excludes memos entered from the Sales
       Target side — those only ever count toward Sales Target. */
    entries = entries.filter(e=>e.source!=='target');
  }
  return productBreakdownFromEntries(entries);
}
/* Same aggregation, but works directly off a given (already scoped/filtered)
   list of entries — used when a filter is currently active in the account
   view and its Summary should reflect just the filtered memos. */
function productBreakdownFromEntries(entries){
  const map = {};
  entries.forEach(e=>{
    (e.items||[]).forEach(it=>{
      const key = (it.modelNumber||'')+'||'+(it.productName||'');
      if(!map[key]) map[key] = {productName:it.productName, modelNumber:it.modelNumber, qty:0};
      map[key].qty += Number(it.qty)||0;
    });
  });
  /* Zero-quantity lines (e.g. a product picked but qty left at 0) are left out
     of every summary — All Accounts Summary, Individual Summary, and their
     printed reports — since a 0 line has nothing to show. */
  return Object.values(map).filter(r=>r.qty!==0).sort((a,b)=>(a.productName||'').localeCompare(b.productName||''));
}
function distinctProductNames(products){ return [...new Set(products.map(p=>p.productName).filter(Boolean))].sort(); }

function computeDuplicateKeys(entries){
  /* Same memo number alone is enough to flag a duplicate, regardless of date. */
  const map = {};
  entries.forEach(e=>{
    const k = String(e.memo||'').trim().toLowerCase();
    if(!k) return;
    (map[k] = map[k]||[]).push(e);
  });
  const dupIds = new Set();
  Object.values(map).forEach(group=>{ if(group.length>1) group.forEach(e=>dupIds.add(e.id)); });
  return dupIds;
}

/* One salesman's entries as they appear in that mode's account view: Sales
   Target = all memos (either side) dated within the target period;
   Promotional Sales = memos entered from the Promotional side only. Shared
   by the account view itself and the Duplicate Memo Summary so the SL
   numbers in both always agree. */
function acctBaseEntries(bizKey, name, mode){
  let list = getSales(bizKey).filter(e=>e.salesman===name);
  if(mode==='target'){
    list = list.filter(e=>inTargetPeriod(bizKey, e));
  } else {
    list = list.filter(e=>e.source!=='target');
  }
  return list;
}
/* SL always reflects a memo's true chronological position (date ascending)
   within this account's own full list — never renumbered to just a
   filtered/search subset — so the same memo shows the same SL everywhere
   it appears (the account table, print/PDF, Duplicate Memo Summary). */
function acctSlMap(bizKey, name, mode){
  const entries = acctBaseEntries(bizKey, name, mode);
  const dupIds = computeDuplicateKeys(entries);
  const chronological = sortEntries(entries, 'date', 'asc', bizKey, dupIds);
  return new Map(chronological.map((e,i)=>[e.id, i+1]));
}

/* ---------------- Toasts ---------------- */
function toast(msg, type, opts){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast '+(type||'success');
  el.textContent = msg;
  if(opts && opts.undo){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-undo'; b.textContent = 'Undo';
    b.onclick = ()=>{ try{ opts.undo(); }catch(err){} el.remove(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, (opts && opts.undo) ? 10000 : 2600);
}

function animateValue(el, to, opts={}){
  if(!el) return;
  const from = opts.from != null ? opts.from : 0;
  const dur = opts.duration || 700;
  const isMoney = !!opts.money;
  const start = performance.now();
  el.classList.add('counting');
  function frame(now){
    const t = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-t, 3);
    const val = from + (to-from)*eased;
    if(isMoney) el.textContent = fmtMoney(val);
    else el.textContent = Math.round(val).toLocaleString();
    if(t < 1) requestAnimationFrame(frame);
    else {
      if(isMoney) el.textContent = fmtMoney(to);
      else el.textContent = Math.round(to).toLocaleString();
      el.classList.remove('counting');
    }
  }
  requestAnimationFrame(frame);
}

function copyToClipboard(text){

    navigator.clipboard.writeText(text).then(()=>toast('Summary copied to clipboard')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}

  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Summary copied to clipboard'); }catch(e){ toast('Copy failed','danger'); }

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
/* Opens the device's native share sheet (Drive, WhatsApp, email, etc.) so the
   file can be sent straight to Google Drive without a manual upload step.
   Falls back to a normal download if the browser doesn't support file sharing. */
async function shareFile(blob, filename, mimeType){
  try{
    const file = new File([blob], filename, {type: mimeType});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  }catch(err){
    if(err && err.name==='AbortError') return; // user cancelled the share sheet, not an error
  }
  downloadBlob(blob, filename);
  toast('Sharing isn\'t available here — the file downloaded instead. Open it from your Downloads or Files app to upload it to Drive.');
}

/* ---------------- Modal engine ---------------- */
function openModal({title, bodyHtml, wide, onMount, footerHtml, onClose}){
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${wide?'modal-wide':''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${title}</h3><button class="modal-close" data-close type="button">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml? `<div class="modal-foot">${footerHtml}</div>` : ''}
    </div>`;
  root.appendChild(overlay);
  root.style.pointerEvents = 'auto';

  function close(){
    overlay.remove();
    if(!root.children.length) root.style.pointerEvents = 'none';
    document.removeEventListener('keydown', escHandler);
    if(onClose) onClose();
  }
  function escHandler(e){ if(e.key==='Escape'){ e.preventDefault(); close(); } }
  document.addEventListener('keydown', escHandler);
  overlay.querySelector('[data-close]').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });

  const api = {overlay, close};
  if(onMount) onMount(api);
  setTimeout(()=>{ const f = overlay.querySelector('input,select,textarea'); if(f) f.focus(); }, 30);
  return api;
}

/* Enter = move to next field / submit on last field. Esc handled globally by openModal. Tab uses native order. */
function enableEnterNav(container, onSubmit){
  container.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const tag = e.target.tagName.toLowerCase();
    if(tag==='textarea') return;
    if(e.target.dataset && e.target.dataset.noenter) return;
    e.preventDefault();
    const focusables = Array.from(container.querySelectorAll('input, select, textarea'))
      .filter(el=>!el.disabled && el.offsetParent!==null);
    const idx = focusables.indexOf(e.target);
    if(idx > -1 && idx < focusables.length-1){
      focusables[idx+1].focus();
      if(focusables[idx+1].select) focusables[idx+1].select();
    } else if(onSubmit){
      onSubmit();
    }
  });
}

/* Renaming a salesman migrates every place their name is used as a key, so
   nothing gets orphaned: their sales entries, saved sales target, and any
   saved ledger filter all move over to the new name. */
function renameSalesman(bizKey, oldName, newName){
  if(!newName || newName===oldName) return;
  const list = getSalesmen(bizKey);
  if(list.includes(newName)){ toast('That salesman name already exists for this business','danger'); return; }
  const idx = list.indexOf(oldName);
  if(idx<0) return;
  list[idx] = newName;
  saveSalesmen(bizKey, list);
  saveSales(bizKey, getSales(bizKey).map(e=> e.salesman===oldName ? {...e, salesman:newName} : e), {silent:true, noStock:true});
  const ph = getPhone(bizKey, oldName); if(ph){ setPhone(bizKey, newName, ph); setPhone(bizKey, oldName, ''); }
  auditAdd([{act:'edit', biz:bizKey, txt:'Salesman renamed: '+oldName+' → '+newName}]);
  const targets = getTargets(bizKey);
  if(oldName in targets){ targets[newName] = targets[oldName]; delete targets[oldName]; Store.set('targets_'+bizKey, targets); }
  const savedFilter = Store.get('sales_filter_'+bizKey+'||'+oldName, null);
  if(savedFilter){ Store.set('sales_filter_'+bizKey+'||'+newName, savedFilter); }
  toast('Salesman renamed');
}
function renameContractor(oldName, newName){
  if(!newName || newName===oldName) return;
  const list = getContractors();
  if(list.includes(newName)){ toast('That contractor name already exists','danger'); return; }
  const idx = list.indexOf(oldName);
  if(idx<0) return;
  list[idx] = newName;
  saveContractors(list);
  BUSINESSES.forEach(b=>{ const l = getSales(b.key); if(l.some(e=>e.contractor===oldName)) saveSales(b.key, l.map(e=>e.contractor===oldName ? {...e, contractor:newName} : e), {silent:true, noStock:true}); });
  auditAdd([{act:'edit', txt:'Contractor renamed: '+oldName+' → '+newName}]);
  toast('Contractor renamed');
}

function printHtmlContent(title, innerHtml){

function csvDownload(headers, rows, name){
  const q = v=>{ v = String(v==null?'':v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const txt = '\uFEFF'+[headers].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  downloadBlob(new Blob([txt], {type:'text/csv;charset=utf-8'}), name+'.csv');
}
function excelFromRows(sheetName, headers, rows, filenameHint){
  if(typeof XLSX==='undefined'){
    csvDownload(headers, rows, (filenameHint||sheetName).replace(/[^a-z0-9]+/gi,'_').toLowerCase());
    toast('Excel library is not loaded (no internet) — saved as a CSV file, which opens in Excel.');
    return;
  }
  try{
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,28));
    XLSX.writeFile(wb, (filenameHint||sheetName).replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.xlsx');
    toast('Excel file downloaded');
  }catch(err){
    toast('Excel export needs an internet connection (export library failed to load).', 'danger');
  }
}
/* Full backup as a multi-sheet Excel workbook — every business's sales
   memos, products, salesmen/targets, session periods and settings, all in
   one .xlsx file. This is a human-readable safety copy alongside the exact
   .json backup (which is what "Restore" reads back in). */
function downloadFullBackupExcel(returnWb){
  try{
    const wb = XLSX.utils.book_new();
    function addSheet(name, headers, rows){
      const ws = XLSX.utils.aoa_to_sheet([headers, ...(rows.length?rows:[[]])]);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
    }

    const salesRows = [];
    BUSINESSES.forEach(b=>{
      getSales(b.key).forEach(e=>{
        const promoAmt = entryPromoAmount(b.key, e);
        const sourceLabel = e.source==='target' ? 'Sales Target' : 'Promotional Sales';
        const items = (e.items && e.items.length) ? e.items : [{productName:'', modelNumber:'', qty:''}];
        items.forEach(it=>{
          salesRows.push([b.name, e.salesman||'', e.date||'', e.memo||'', sourceLabel, it.productName||'', it.modelNumber||'', it.qty!==undefined?it.qty:'', Number(e.total)||0, promoAmt, e.id||'']);
        });
      });
    });
    addSheet('Sales Entries', ['Business','Salesman','Date','Memo No.','Source','Product Name','Model Number','Qty','Memo Total','Promo Amount (Memo)','Entry ID'], salesRows);

    const prodRows = [];
    BUSINESSES.forEach(b=>{
      getProducts(b.key).forEach(p=>{
        prodRows.push([b.name, p.productName||'', p.modelNumber||'', Number(p.price)||0, Number(p.quantity)||0, Number(p.targetQuantity)||0, Number(p.spQty)||0, Number(p.ctQty)||0]);
      });
    });
    addSheet('Products', ['Business','Product Name','Model Number','Price','Quantity','Target Quantity','SP Qty','CT Qty'], prodRows);

    const acctRows = [];
    BUSINESSES.forEach(b=>{
      getSalesmen(b.key).forEach(name=>{ acctRows.push([b.name, name, getTarget(b.key, name)]); });
    });
    addSheet('Salesmen & Targets', ['Business','Salesman','Sales Target Amount'], acctRows);

    const sessRows = BUSINESSES.map(b=>{ const p = getSessionPeriod(b.key); return [b.name, p.from||'', p.to||'']; });
    addSheet('Session Periods', ['Business','Target Period From','Target Period To'], sessRows);

    const s = getSettings();
    addSheet('Settings', ['Field','Value'], [
      ['Company Name', s.companyName||''],
      ['Currency', s.currency||''],
      ['Theme Pack', s.themePack||''],
      ['App Version', APP_VERSION],
      ['Exported At', new Date().toLocaleString()],
    ]);

    if(returnWb) return wb;
    XLSX.writeFile(wb, 'promaxis_backup_'+todayStr()+'.xlsx');
    markBackupDone();
    toast('Excel backup downloaded');
  }catch(err){
    toast('Excel export needs an internet connection (export library failed to load).', 'danger');
  }
}

/* One consolidated report per business, in two flavors:
   Sales Target: Rank / Business / Salesman / Sales Target Achieve / Target / Promo Target Achieve / Achieve %
     — "Sales Target Achieve" and "Achieve %" are the memos' full total amount within the target period
     (Settings → Session Period); "Promo Target Achieve" is just the promotional value of those same memos.
   Promotional Sales: Rank / Business / Salesman / Total Sales / Promotional Sales — tracked all-time. */
function printBusinessReport(bizKey, mode){
  mode = mode || 'target';
  const f = getRSFilter();
  const df = f.dateFrom || '', dt = f.dateTo || '';
  const rangeNote = isRSFilterActive(f) ? ' (Filter: '+rsFilterLabel(f)+')' : '';
  if(mode==='promo'){
    const stats = reportableAccountStats(bizKey, 'promo', df, dt).sort((a,c)=>c.total-a.total);
    const headers = ['Rank','Business','Salesman','Total Sales','Promotional Sales'];
    const rows = stats.map((s,i)=>[i+1, bizName(bizKey), s.name, fmtMoney(s.total), fmtMoney(s.promo)]);
    pdfFromRows('Report — Promotional Sales — '+bizName(bizKey)+rangeNote, headers, rows, bizName(bizKey)+'_promo_report');
    return;
  }
  const stats = reportableAccountStats(bizKey, 'target', df, dt).sort((a,c)=>c.periodTotal-a.periodTotal);
  const headers = ['Rank','Business','Salesman','Sales Target Achieve','Target','Promo Target Achieve','Achieve %'].concat(incentiveOn()?['Incentive']:[]);
  const rows = stats.map((s,i)=>[i+1, bizName(bizKey), s.name, fmtMoney(s.periodTotal), fmtMoney(s.target), fmtMoney(s.periodPromo), s.pct+'%'].concat(incentiveOn()?[incText(s.incentive)]:[]));
  pdfFromRows('Report — Sales Target — '+bizName(bizKey)+' (Target Period: '+targetPeriodLabel(bizKey)+')'+rangeNote, headers, rows, bizName(bizKey)+'_target_report');
}

function renderDashboard(){

  const bizStats = BUSINESSES.map(b=>{

       count memos entered from the Sales Target side — those only ever

    const promoSales = sales.filter(e=>e.source!=='target');

const acctViewState = {};
function blankAVS(){ return {search:'', dateFrom:'', dateTo:'', memoFrom:'', memoTo:'', product:'', totalMin:'', totalMax:'', promoMin:'', promoMax:'', status:'', sortBy:'date', sortDir:'asc', filterOpen:false}; }
/* True when any actual data filter is narrowing the account's memo list —
   sortBy/sortDir/filterOpen don't remove memos, so they don't count. */
function isFilterActive(avs){
  return !!(avs.search || avs.dateFrom || avs.dateTo || avs.memoFrom || avs.memoTo || avs.product || avs.status || avs.totalMin!=='' || avs.totalMax!=='' || avs.promoMin!=='' || avs.promoMax!=='');
}
function getAVS(bizKey, name){
  const k = bizKey+'||'+name;
  if(!acctViewState[k]){
    const saved = Store.get('sales_filter_'+k, null);
    acctViewState[k] = saved ? {...blankAVS(), ...saved, search:'', filterOpen:false} : blankAVS();
  }
  return acctViewState[k];
}
function saveAVSFilter(bizKey, name, avs){
  const {search, filterOpen, ...persisted} = avs;
  Store.set('sales_filter_'+bizKey+'||'+name, persisted);
}
/* Default sort is chronological (oldest to newest, memo as tiebreaker); the
   Sort by / Direction filter fields let the user pick any column instead. */
function sortByDate(list){ return sortEntries(list, 'date', 'asc'); }
function sortEntries(list, sortBy, sortDir, bizKey, dupIds){
  const dir = sortDir==='desc' ? -1 : 1;
  return list.slice().sort((a,b)=>{
    let cmp = 0;
    if(sortBy==='memo') cmp = String(a.memo||'').localeCompare(String(b.memo||''), undefined, {numeric:true});
    else if(sortBy==='total') cmp = (Number(a.total)||0) - (Number(b.total)||0);
    else if(sortBy==='promo' && bizKey) cmp = entryPromoAmount(bizKey,a) - entryPromoAmount(bizKey,b);
    else if(sortBy==='status' && dupIds) cmp = (dupIds.has(a.id)?1:0) - (dupIds.has(b.id)?1:0);
    else {
      cmp = String(a.date||'').localeCompare(String(b.date||''));
      if(cmp===0) cmp = String(a.memo||'').localeCompare(String(b.memo||''), undefined, {numeric:true});
    }
    return dir*cmp;
  });
}
function filterAcctSales(list, avs, bizKey, dupIds){
  return list.filter(e=>{
    if(avs.dateFrom && e.date < avs.dateFrom) return false;
    if(avs.dateTo && e.date > avs.dateTo) return false;
    if(avs.memoFrom && String(e.memo) < avs.memoFrom) return false;
    if(avs.memoTo && String(e.memo) > avs.memoTo) return false;
    if(avs.product && !(e.items||[]).some(it=>((it.productName||'')+' '+(it.modelNumber||'')).toLowerCase().includes(avs.product.toLowerCase()))) return false;
    if(avs.totalMin!=='' && Number(e.total) < Number(avs.totalMin)) return false;
    if(avs.totalMax!=='' && Number(e.total) > Number(avs.totalMax)) return false;
    if(bizKey && avs.promoMin!=='' && entryPromoAmount(bizKey,e) < Number(avs.promoMin)) return false;
    if(bizKey && avs.promoMax!=='' && entryPromoAmount(bizKey,e) > Number(avs.promoMax)) return false;
    if(avs.status && dupIds){
      const isDup = dupIds.has(e.id);
      if(avs.status==='ok' && isDup) return false;
      if(avs.status==='dup' && !isDup) return false;
    }
    if(avs.search){
      const hay = [e.memo, e.date, ...(e.items||[]).map(it=>(it.productName||'')+' '+(it.modelNumber||''))].join(' ').toLowerCase();
      if(!hay.includes(avs.search.toLowerCase())) return false;
    }
    return true;
  });
}
