/* ---- Pure-JS SHA-256 (sync, works on file:// and http) ---- */
const SHA256 = (function(){
  const K = [], H0 = [];
  (function init(){
    const isPrime = n => { for(let i=2, s=Math.sqrt(n); i<=s; i++) if(n%i===0) return false; return true; };
    const frac = x => (x - Math.floor(x)) * 4294967296 | 0;
    for(let n=2, c=0; c<64; n++){ if(isPrime(n)){ if(c<8) H0[c] = frac(Math.pow(n, 1/2)); K[c] = frac(Math.pow(n, 1/3)); c++; } }
  })();
  function rotr(x, n){ return (x>>>n) | (x<<(32-n)); }
  function bytes(str){ return new TextEncoder().encode(str); }
  function hashBytes(msg){
    const l = msg.length, bitLen = l*8;
    const total = (((l + 9 + 63) >> 6) << 6);
    const buf = new Uint8Array(total);
    buf.set(msg); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total-8, Math.floor(bitLen/4294967296)); dv.setUint32(total-4, bitLen>>>0);
    const h = H0.slice(), w = new Array(64);
    for(let o=0; o<total; o+=64){
      for(let i=0; i<16; i++) w[i] = dv.getUint32(o+i*4);
      for(let i=16; i<64; i++){
        const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15]>>>3);
        const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2]>>>10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      let [a,b,c,d,e,f,g,hh] = h;
      for(let i=0; i<64; i++){
        const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0]=(h[0]+a)|0; h[1]=(h[1]+b)|0; h[2]=(h[2]+c)|0; h[3]=(h[3]+d)|0;
      h[4]=(h[4]+e)|0; h[5]=(h[5]+f)|0; h[6]=(h[6]+g)|0; h[7]=(h[7]+hh)|0;
    }
    return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
  }
  return { hex: str => hashBytes(bytes(str)) };
})();

/* ---- Three-way merge used by Cloud Sync ---- */
function stable(v){
  if(Array.isArray(v)) return v.map(stable);
  if(v && typeof v==='object'){ const o={}; Object.keys(v).sort().forEach(k=>{ if(v[k]!==undefined) o[k]=stable(v[k]); }); return o; }
  return v;
}
const jsonEq = (a,b) => JSON.stringify(stable(a)) === JSON.stringify(stable(b));
const isObj = x => x && typeof x==='object' && !Array.isArray(x);
const isPrim = x => x===null || (typeof x!=='object' && typeof x!=='function');
const isIdList = a => Array.isArray(a) && a.every(x=>isObj(x) && x.id!==undefined);

function mergeRecord(b, l, r){
  /* both devices changed the same record: merge it field by field. Stock (quantity) is a counter,
     so concurrent sales on two PCs are added together instead of one overwriting the other. */
  const out = {};
  new Set([...Object.keys(r), ...Object.keys(l)]).forEach(k=>{
    let v;
    if(jsonEq(l[k], r[k])) v = l[k];
    else if(jsonEq(l[k], b[k])) v = r[k];
    else if(jsonEq(r[k], b[k])) v = l[k];
    else if(k==='quantity' && [b[k], l[k], r[k]].every(x=>typeof x==='number')) v = Math.round((b[k] + (l[k]-b[k]) + (r[k]-b[k]))*1000)/1000;
    else v = l[k];
    if(v!==undefined) out[k] = v;
  });
  return out;
}
function mergeIdLists(base, local, remote, tomb){
  /* Cloud order wins, so every PC settles on the same order (same-date memos keep the same SL everywhere). */
  const bm = new Map(base.map(x=>[x.id,x]));
  const lm = new Map(local.map(x=>[x.id,x]));
  const seen = new Set(), out = [];
  remote.forEach(r=>{
    seen.add(r.id);
    const l = lm.get(r.id), b = bm.get(r.id);
    let item = r;
    if(l && !jsonEq(l, r)){
      if(b && jsonEq(r, b)) item = l;           /* only this device changed it */
      else if(b && jsonEq(l, b)) item = r;      /* only the other device changed it */
      else if(b) item = mergeRecord(b, l, r);   /* both changed it: merge field by field */
      else item = l;                            /* never synced before: this device wins */
    }
    if(!tomb[r.id]) out.push(item);
  });
  local.forEach(l=>{ if(!seen.has(l.id) && !tomb[l.id]) out.push(l); });
  return out;
}
function mergePrimLists(base, local, remote){
  const bs = new Set(base), ls = new Set(local), rs = new Set(remote), out = [];
  remote.concat(local).forEach(x=>{
    if(out.includes(x)) return;
    const goneLocal = bs.has(x) && !ls.has(x), goneRemote = bs.has(x) && !rs.has(x);
    if(!goneLocal && !goneRemote) out.push(x);
  });
  return out;
}
function mergeValue(base, local, remote, tomb){
  if(jsonEq(local, remote)) return local;
  /* Lists of records (memos, products, bin, audit): always merge record-by-record, and only a
     tombstone can delete a record — a record that is merely missing on one side is kept. */
  if(Array.isArray(local) && Array.isArray(remote) && isIdList(local) && isIdList(remote))
    return mergeIdLists(Array.isArray(base) ? base : [], local, remote, tomb);
  if(jsonEq(local, base)) return remote;
  if(jsonEq(remote, base)) return local;
  if(local===undefined) return remote;
  if(remote===undefined) return local;
  if(Array.isArray(local) && Array.isArray(remote)){
    const b = Array.isArray(base) ? base : [];
    if(isIdList(local) && isIdList(remote)) return mergeIdLists(b, local, remote, tomb);
    if(local.every(isPrim) && remote.every(isPrim)) return mergePrimLists(b, local, remote);
    return local;
  }
  if(isObj(local) && isObj(remote)){
    const b = isObj(base) ? base : {}, out = {};
    new Set([...Object.keys(local), ...Object.keys(remote)]).forEach(k=>{
      const v = mergeValue(b[k], local[k], remote[k], tomb);
      if(v!==undefined) out[k] = v;
    });
    return out;
  }
  return local;
}
const TOMB_KEEP_MS = 120*86400000;
function mergeStates(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const now = Date.now(), tomb = {};
  [remote.tomb, local.tomb].forEach(t=>{ Object.entries(t||{}).forEach(([id,ts])=>{ if(now - new Date(ts).getTime() < TOMB_KEEP_MS) tomb[id] = ts; }); });
  const out = {};
  new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]).forEach(k=>{
    if(k==='tomb'){ out.tomb = tomb; return; }
    if(k==='app_auth'){ const l=local[k], r=remote[k]; const v = !l ? r : !r ? l : ((l.at||'') >= (r.at||'') ? l : r); if(v!==undefined) out[k]=v; return; }
    let v = mergeValue(base[k], local[k], remote[k], tomb);
    if(isIdList(v)) v = v.filter(x=>!tomb[x.id]);
    if(v!==undefined) out[k] = v;
  });
  if(!out.tomb) out.tomb = tomb;
  return out;
}

let _gisPromise = null;
function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();

/* mode: 'interactive' (user just clicked), 'gesture' (inside a click, may open the popup), 'silent' (background) */
function gdToken(mode, force){
  return new Promise((resolve, reject)=>{
    if(!force && _sync.token && _sync.token.exp > Date.now()+60000) return resolve(_sync.token.value);
    const cfg = syncCfg();
    if(!cfg.clientId) return reject(Object.assign(new Error('Add your Google Client ID first'), {code:'noclient'}));
    loadGis().then(()=>{
      let done = false;
      const client = google.accounts.oauth2.initTokenClient({
        client_id: cfg.clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        hint: cfg.hint || undefined,
        callback: r=>{
          if(done) return; done = true;
          if(r.error) return reject(Object.assign(new Error(r.error_description || r.error), {code:'auth'}));
          _sync.token = {value:r.access_token, exp:Date.now()+(Number(r.expires_in)||3600)*1000};
          if(!cfg.consented) setSyncCfg({consented:true});
          resolve(r.access_token);
        },
        error_callback: e=>{ if(done) return; done = true; reject(Object.assign(new Error((e && e.type) || 'sign-in window closed'), {code:'popup'})); }
      });
      client.requestAccessToken({prompt: mode==='interactive' ? (cfg.consented ? '' : 'consent') : (mode==='silent' ? 'none' : '')});
    }).catch(e=>reject(e.code ? e : Object.assign(e, {code:'load'})));
  });
}
/* ---- gzip helpers: the sync file is compressed (roughly 8x smaller), which is what makes a sync take ~1 second ---- */
const canGzip = typeof CompressionStream!=='undefined' && typeof DecompressionStream!=='undefined';
async function gzipText(text){
  if(!canGzip) return new Blob([text], {type:'application/json'});
  return new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
}
async function blobToText(blob){
  const head = new Uint8Array(await blob.slice(0,2).arrayBuffer());
  if(head[0]===0x1f && head[1]===0x8b) return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return blob.text();
}
async function gdApi(token, url, init){

  if(r.status===401){ _sync.token = null; throw Object.assign(new Error('Google session expired'), {code:'auth'}); }

async function gdFindFile(token){
  const q = encodeURIComponent("name='"+SYNC_FILE+"' and trashed=false");
  const j = await (await gdApi(token, `${DRIVE}?q=${q}&fields=files(id,version,modifiedTime)&spaces=drive&orderBy=modifiedTime%20desc&pageSize=10`)).json();
  return (j.files && j.files[0]) || null;
}
async function gdMeta(token, id){ return (await gdApi(token, `${DRIVE}/${id}?fields=id,version,modifiedTime`)).json(); }
async function gdRead(token, id){ return JSON.parse(await blobToText(await (await gdApi(token, `${DRIVE}/${id}?alt=media`)).blob())); }
/* generic multipart create (metadata + file body) */
async function gdMultipart(token, metadata, contentType, body){
  const b = 'pmx'+Math.random().toString(36).slice(2);
  const blob = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${b}\r\nContent-Type: ${contentType}\r\n\r\n`, body, `\r\n--${b}--`]);
  return (await gdApi(token, `${DRIVE_UP}?uploadType=multipart&fields=id,version,name,webViewLink`, {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:blob})).json();
}
async function gdPut(token, id, contentType, body){
  return (await gdApi(token, `${DRIVE_UP}/${id}?uploadType=media&fields=id,version`, {method:'PATCH', headers:{'Content-Type':contentType}, body})).json();
}
async function gdCreate(token, obj){ const blob = await gzipText(JSON.stringify(obj)); return gdMultipart(token, {name:SYNC_FILE, mimeType:'application/octet-stream'}, 'application/octet-stream', blob); }
async function gdUpdate(token, id, obj){ const blob = await gzipText(JSON.stringify(obj)); return gdPut(token, id, 'application/octet-stream', blob); }
function applyMergedState(local, merged){
  let changed = 0;
  _sync.applying = true;
  try{
    Object.keys(merged).forEach(k=>{ if(isLocalOnlyKey(k)) return; if(!jsonEq(merged[k], local[k])){ Store.set(k, merged[k]); changed++; } });
    Object.keys(local).forEach(k=>{ if(isLocalOnlyKey(k)) return; if(!(k in merged)){ Store.del(k); changed++; } });
  } finally { _sync.applying = false; }
  if(changed){ rebuildShadows(); applyTheme(getSettings()); }
  return changed;
}
const tokenAlive = (minMs)=>!!(_sync.token && _sync.token.exp > Date.now()+(minMs||0));
/* Google only hands out 1-hour tokens to a web page. A click/keypress is needed to renew one (browsers block pop-ups otherwise),
   so the next click after the token gets old renews it quietly and syncing carries on. */
function armReauth(){
  if(_sync.armed) return;
  _sync.armed = true;
  const h = ()=>{
    document.removeEventListener('pointerdown', h, true); document.removeEventListener('keydown', h, true);
    _sync.armed = false;
    gdToken('gesture', true).then(()=>{ _sync.state = 'ok'; _sync.err = ''; updateSyncBadge(); syncNow({}); })
      .catch(e=>{ if(!tokenAlive(0)){ _sync.state = 'reconnect'; _sync.err = e.message; updateSyncBadge(); armReauth(); } });
  };
  document.addEventListener('pointerdown', h, true); document.addEventListener('keydown', h, true);
}
let _pendingRefresh = false, _lastPullToast = 0;
function viewIsBusy(){
  if(document.getElementById('modalRoot').children.length>0) return 'modal';
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && document.getElementById('view').contains(ae)) return 'typing';
  return '';
}
function refreshAfterPull(){
  const busy = viewIsBusy();
  if(busy){ _pendingRefresh = true; if(busy==='modal') toast('☁ New data arrived from another PC — it shows when you close this window'); return; }
  buildSidebar(); route();
  if(Date.now()-_lastPullToast > 8000){ toast('☁ Updated with changes from another PC'); _lastPullToast = Date.now(); }
}
document.addEventListener('focusout', ()=>{ if(_pendingRefresh) setTimeout(()=>{ if(!viewIsBusy()){ _pendingRefresh = false; buildSidebar(); route(); } }, 200); });
document.addEventListener('click', ()=>{ if(_pendingRefresh) setTimeout(()=>{ if(!viewIsBusy()){ _pendingRefresh = false; buildSidebar(); route(); } }, 300); });

async function syncNow(opts){
  opts = opts || {};
  const cfg = syncCfg();
  if(!cfg.clientId || (!cfg.enabled && !opts.force)) return false;
  if(_sync.busy){ _sync.rerun = true; return false; }
  if(!navigator.onLine){ updateSyncBadge(); return false; }
  _sync.busy = true; _sync.firstPending = 0;
  if(_sync.state!=='ok' || opts.manual) { _sync.state = 'syncing'; _sync.err = ''; updateSyncBadge(); }
  let ok = false, pulled = 0, didWork = false;
  try{
    const token = await gdToken(opts.interactive ? 'interactive' : (opts.gesture ? 'gesture' : 'silent'));
    for(let attempt=1; ; attempt++){
      let file = null;
      const fid = syncCfg().fileId;
      if(fid){ try{ file = await gdMeta(token, fid); }catch(e){ if(e.status!==404) throw e; } }
      if(!file){ file = await gdFindFile(token); if(file) setSyncCfg({fileId:file.id}); }
      const remoteUnchanged = !!(file && _sync.remoteVersion && String(file.version)===_sync.remoteVersion);
      if(remoteUnchanged && !_sync.dirty && !opts.manual) break;          /* nothing new on either side */
      const local = buildSyncState(), seqAtLocal = _sync.seq;
      let merged, needUpload;
      if(remoteUnchanged){                                                 /* fast path: only this PC changed anything */
        merged = local; needUpload = true;
      } else {
        let remote = null;
        if(file){ const doc = await gdRead(token, file.id); if(doc && doc.state) remote = doc; }
        merged = remote ? mergeStates(Store.get('sync_base', {}), local, remote.state) : local;
        needUpload = !remote || !jsonEq(merged, remote.state);
        if(needUpload && file && attempt<3){
          const again = await gdMeta(token, file.id);                      /* someone else saved while we were merging? merge again */
          if(String(again.version) !== String(file.version)) continue;
        }
        pulled = applyMergedState(local, merged);
        _sync.remoteVersion = file ? String(file.version) : null;
      }
      if(needUpload){
        const payload = {format:'promaxis-sync', v:2, appVersion:APP_VERSION, savedAt:new Date().toISOString(), device:deviceName(), state:merged};
        const res = file ? await gdUpdate(token, file.id, payload) : await gdCreate(token, payload);
        setSyncCfg({fileId:res.id}); _sync.remoteVersion = String(res.version);
      }
      Store.set('sync_base', JSON.parse(JSON.stringify(merged)));
      _sync.dirty = (_sync.seq !== seqAtLocal);
      didWork = true;
      break;
    }
    if(didWork || opts.manual) setSyncCfg({last:new Date().toISOString()});
    if(opts.force && !cfg.enabled) setSyncCfg({enabled:true});
    _sync.state = 'ok'; ok = true;
  }catch(e){
    if(e.code==='auth' || e.code==='popup'){
      _sync.state = 'reconnect'; _sync.err = e.message;
      if(opts.interactive) toast('Google sign-in did not complete ('+e.message+'). Check: this Gmail is a Test user, and this page address is under Authorized JavaScript origins.', 'danger'); else armReauth();
    } else if(e.code==='noclient'){
      _sync.state = 'error'; _sync.err = e.message; toast(e.message, 'danger');
    } else {
      _sync.state = 'error'; _sync.err = (e && e.message) || 'Unknown error';
      if(opts.interactive || opts.manual) toast('Sync failed: '+_sync.err, 'danger');
      scheduleSync(5000);
    }
  } finally {
    _sync.busy = false;
    updateSyncBadge();
    if(_sync.rerun){ _sync.rerun = false; scheduleSync(500); }
  }
  if(ok && pulled) refreshAfterPull();
  else if(ok && (opts.manual || opts.interactive)) toast('☁ Synced');
  if(ok && _sync.dirty) scheduleSync(800);
  if(ok && didWork) maybeDriveAutoBackup();
  return ok;
}
/* changes are sent about 1 second after the last edit (never later than 5 seconds into a long burst of edits) */
function scheduleSync(ms){
  clearTimeout(_sync.timer);
  if(!syncCfg().enabled) return;
  if(ms===undefined){
    if(!_sync.firstPending) _sync.firstPending = Date.now();
    ms = Math.max(200, Math.min(1000, 5000-(Date.now()-_sync.firstPending)));
  }
  _sync.timer = setTimeout(()=>syncNow({}), ms);
}
/* other PCs are checked every 2 seconds with a tiny "has the file changed?" request */
let _pollTimer = null;
async function pollOnce(){
  const cfg = syncCfg();
  if(!cfg.enabled || _sync.busy || !navigator.onLine || !cfg.fileId) return;
  if(!tokenAlive(0)){ if(_sync.state!=='reconnect'){ _sync.state = 'reconnect'; updateSyncBadge(); } armReauth(); return; }
  if(!tokenAlive(8*60000)) armReauth();                  /* renew in the background on the next click, before it runs out */
  if(_sync.dirty) return;                                  /* our own push is already queued */
  try{
    const m = await gdMeta(_sync.token.value, cfg.fileId);
    if(String(m.version) !== _sync.remoteVersion) syncNow({});
  }catch(e){ if(e.code==='auth'){ _sync.token = null; } }
}
function pollLoop(){
  clearTimeout(_pollTimer);
  _pollTimer = setTimeout(async ()=>{ try{ await pollOnce(); }catch(e){} pollLoop(); }, document.hidden ? 15000 : 2000);
}

let _snapTimer = null;
function snapshotKeys(){ return Object.keys(_cache).filter(k=>k.indexOf('autobak_')===0).sort(); }
function scheduleSnapshot(){ clearTimeout(_snapTimer); _snapTimer = setTimeout(()=>maybeSnapshot(false), 120000); }
function maybeSnapshot(force){
  const hasData = BUSINESSES.some(b=>getSales(b.key).length || getProducts(b.key).length);
  if(!hasData) return;
  const key = 'autobak_'+todayStr(), cur = Store.get(key, null);
  if(!force && cur && (Date.now() - new Date(cur.at).getTime() < 3600000)) return;
  Store.set(key, {at:new Date().toISOString(), memos:BUSINESSES.reduce((a,b)=>a+getSales(b.key).length,0), products:BUSINESSES.reduce((a,b)=>a+getProducts(b.key).length,0), state:collectFullState()});
  snapshotKeys().slice(0, -7).forEach(k=>Store.del(k));
}
function startSyncEngine(){
  Store.onChange = function(key){
    if(_sync.applying || isLocalOnlyKey(key)) return;
    _sync.seq++; _sync.dirty = true;
    updateSyncBadge(); scheduleSync(); scheduleSnapshot();
  };
  const badge = document.getElementById('syncBadge');
  if(badge) badge.onclick = ()=>{ if(_sync.state==='reconnect' || _sync.state==='error') syncNow({interactive:true, manual:true}); else location.hash = 'backup'; };
  window.addEventListener('online', ()=>{ updateSyncBadge(); scheduleSync(500); });
  window.addEventListener('offline', updateSyncBadge);
  const wake = ()=>{ if(!document.hidden && syncCfg().enabled){ pollOnce(); } };
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('focus', wake);
  updateSyncBadge();
  if(syncCfg().enabled){ setTimeout(()=>syncNow({}), 300); armReauth(); }   /* armed so the very first click (e.g. the login button) can renew Google access */
  pollLoop();
  setTimeout(()=>maybeSnapshot(false), 4000);
}

function wireSyncCards(){
  const v = document.getElementById('view');
  updateSyncBadge();
  const readCfg = ()=>({clientId:document.getElementById('syncClientId').value.trim(), hint:document.getElementById('syncHint').value.trim(), device:document.getElementById('syncDevice').value.trim()});
  document.getElementById('syncDevice').onchange = ()=>setSyncCfg({device:readCfg().device});
  document.getElementById('btnSyncConnect').onclick = async ()=>{
    if(location.protocol==='file:'){ toast('Google sign-in does not work when the app is opened from a folder. Open it from your https address (GitHub Pages) and connect there.', 'danger'); return; }
    const c = readCfg();
    if(!/\.apps\.googleusercontent\.com$/.test(c.clientId)){ toast('Paste the full Client ID (ends with .apps.googleusercontent.com)', 'danger'); return; }
    setSyncCfg({clientId:c.clientId, hint:c.hint, device:c.device || 'PC-'+randHex(2)});
    _sync.token = null;
    await syncNow({interactive:true, manual:true, force:true});
    renderBackup();
  };
  document.getElementById('btnSyncNow').onclick = async ()=>{ await syncNow({interactive:true, manual:true}); renderBackup(); };
  document.getElementById('btnSyncOff').onclick = ()=>{
    confirmDialog('Disconnect cloud sync?', 'This PC stops syncing. Your data on this PC stays exactly as it is, and the copy in Google Drive is not deleted.', ()=>{
      setSyncCfg({enabled:false, fileId:'', last:null}); Store.del('sync_base'); _sync.token = null; _sync.state = 'off';
      updateSyncBadge(); renderBackup();
    });
  };
  v.querySelectorAll('[data-snap-dl]').forEach(b=>b.onclick = ()=>{
    const s = Store.get(b.dataset.snapDl, null); if(!s) return;
    downloadBlob(new Blob([JSON.stringify(s.state)], {type:'application/json'}), 'promaxis-snapshot-'+b.dataset.snapDl.slice(8)+'.json');
  });
  v.querySelectorAll('[data-snap-restore]').forEach(b=>b.onclick = ()=>{
    const s = Store.get(b.dataset.snapRestore, null); if(!s) return;
    confirmDialog('Restore this snapshot?', `Your current data will be replaced by the snapshot from ${esc(b.dataset.snapRestore.slice(8))}. What is on screen now goes to the Recycle Bin first, so this can be undone.`, ()=>{
      restoreFullState(s.state);
      auditAdd([{act:'restore', txt:'Restored automatic snapshot of '+b.dataset.snapRestore.slice(8)}]);
      toast('Snapshot restored'); buildSidebar(); route();
    });
  });
  document.getElementById('btnSnapNow').onclick = ()=>{ maybeSnapshot(true); toast('Snapshot saved'); renderBackup(); };
}


/* =========================================================
   Backups saved to Google Drive: JSON, Excel, PDF (+ a daily automatic JSON)
   Files go into a "PROMAXIS Backups" folder in the connected Google Drive.
   ========================================================= */
const BACKUP_FOLDER = 'PROMAXIS Backups';
const AUTO_KEEP = 14;
function nowStamp(){ const d = new Date(); return todayStr()+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); }
async function driveToken(interactive){
  if(!syncCfg().clientId) throw Object.assign(new Error('Add your Google Client ID in the sync card first'), {code:'noclient'});
  return gdToken(interactive ? 'interactive' : 'silent');
}
let _folderPromise = null;
function gdEnsureFolder(token){
  if(!_folderPromise) _folderPromise = _ensureFolder(token).finally(()=>{ _folderPromise = null; });
  return _folderPromise;
}
async function _ensureFolder(token){
  const cfg = syncCfg();
  if(cfg.backupFolderId){ try{ const m = await gdMeta(token, cfg.backupFolderId); if(m && m.id) return cfg.backupFolderId; }catch(e){ if(e.status!==404) throw e; } }
  const find = async ()=>{
    const q = encodeURIComponent("name='"+BACKUP_FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    return ((await (await gdApi(token, `${DRIVE}?q=${q}&fields=files(id,createdTime)&orderBy=createdTime&spaces=drive`)).json()).files) || [];
  };
  let list = await find(), id;
  if(list.length) id = list[0].id;                                   /* the oldest folder wins, so every PC settles on the same one */
  else {
    const r = await gdApi(token, `${DRIVE}?fields=id`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:BACKUP_FOLDER, mimeType:'application/vnd.google-apps.folder'})});
    const mine = (await r.json()).id;
    list = await find();                                             /* did another PC create one at the same moment? */
    id = list.length ? list[0].id : mine;
    if(id!==mine){ try{ await gdDelete(token, mine); }catch(e){} }
  }
  setSyncCfg({backupFolderId:id});
  return id;
}
/* every backup file this app has made (they all start with promaxis_), wherever they sit */
async function gdListBackups(token, nameContains){
  const q = `trashed=false and name contains '${nameContains}'`;
  const j = await (await gdApi(token, `${DRIVE}?q=${encodeURIComponent(q)}&fields=files(id,name,size,createdTime,webViewLink,mimeType)&orderBy=createdTime%20desc&pageSize=100&spaces=drive`)).json();
  return j.files || [];
}
async function gdDelete(token, id){ await gdApi(token, `${DRIVE}/${id}`, {method:'DELETE'}); }
async function gdUploadBackup(token, folderId, name, mime, body){
  return gdMultipart(token, {name, parents:[folderId], mimeType:mime}, mime, body);
}

/* ---- the three file types ---- */
function backupJsonBlob(){ return new Blob([JSON.stringify(collectFullState())], {type:'application/json'}); }
function backupXlsxBlob(){
  if(typeof XLSX==='undefined') throw new Error('The Excel library needs internet once — connect to the internet and try again');
  const wb = downloadFullBackupExcel(true);
  if(!wb) throw new Error('Could not build the Excel file');
  const arr = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  return new Blob([arr], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/* The PDF is produced by Google itself: the report is uploaded as a Google Doc, exported as PDF, and the temporary Doc is removed.
   (That is what makes Bangla text and the ৳ sign print correctly.) */
function backupReportHtml(){
  let body = fullDataPreviewHtml();
  body = body.replace(/<svg[\s\S]*?<\/svg>/g, '').replace(/<table/g, '<table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse; width:100%; font-size:10pt;"').replace(/<th(\s|>)/g, '<th style="background:#0E1E3A; color:#ffffff;"$1');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>PROMAXIS data ${todayStr()}</title></head><body style="font-family:Arial,sans-serif;"><h2>${esc(getSettings().companyName||'PROMAXIS')} — Complete data</h2><p>Saved ${esc(new Date().toLocaleString())}</p>${body}</body></html>`;
}
async function gdMakePdf(token, folderId, name){
  const html = new Blob([backupReportHtml()], {type:'text/html'});
  const doc = await gdMultipart(token, {name:name+' (temp)', mimeType:'application/vnd.google-apps.document'}, 'text/html', html);
  try{
    const pdf = await (await gdApi(token, `${DRIVE}/${doc.id}/export?mimeType=application%2Fpdf`)).blob();
    return await gdUploadBackup(token, folderId, name, 'application/pdf', pdf);
  } finally { try{ await gdDelete(token, doc.id); }catch(e){} }
}
async function saveBackupToDrive(kind){
  const labels = {json:'JSON', xlsx:'Excel', pdf:'PDF'};
  try{
    toast('Saving '+labels[kind]+' to Google Drive…');
    const token = await driveToken(true), folderId = await gdEnsureFolder(token), base = 'promaxis_backup_'+nowStamp();
    let res;
    if(kind==='json') res = await gdUploadBackup(token, folderId, base+'.json', 'application/json', backupJsonBlob());
    else if(kind==='xlsx') res = await gdUploadBackup(token, folderId, base+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', backupXlsxBlob());
    else res = await gdMakePdf(token, folderId, base+'.pdf');
    markBackupDone();
    toast('✓ '+labels[kind]+' saved to Google Drive → “'+BACKUP_FOLDER+'” folder');
    auditAdd([{act:'sync', txt:labels[kind]+' backup saved to Google Drive ('+res.name+')'}]);
    return res;
  }catch(e){
    const hint = kind==='pdf' ? ' (Large data can exceed Google’s conversion limit — use the JSON or Excel backup, or “Download Complete Data (.pdf)”.)' : '';
    toast('Could not save to Google Drive: '+((e && e.message)||'unknown error')+hint, 'danger');
    return null;
  }
}
/* one automatic JSON backup a day, newest 14 kept */
let _autoBusy = false;
async function maybeDriveAutoBackup(){
  const cfg = syncCfg();
  if(!cfg.enabled || cfg.autoDrive===false || cfg.lastAuto===todayStr() || _autoBusy || !tokenAlive(60000)) return;
  if(!BUSINESSES.some(b=>getSales(b.key).length || getProducts(b.key).length)) return;
  _autoBusy = true;
  try{
    const token = _sync.token.value, folderId = await gdEnsureFolder(token), name = 'promaxis_auto_'+todayStr()+'.json';
    const existing = await gdListBackups(token, 'promaxis_auto_');

/* ---------- tiny chart helpers: pure SVG/CSS, so they work offline and follow the theme ---------- */
function niceMax(v){ if(v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function shortNum(n){
  n = Number(n)||0; const a = Math.abs(n);
  if(a>=1e7) return (n/1e7).toFixed(a>=1e8?0:1).replace(/\.0$/,'')+'Cr';
  if(a>=1e5) return (n/1e5).toFixed(1).replace(/\.0$/,'')+'L';
  if(a>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(n));
}
function svgColumns(data, colors, names, aria){
  const W=640, H=250, L=50, R=10, T=14, B=38, iw=W-L-R, ih=H-T-B;
  const max = niceMax(Math.max(0, ...data.flatMap(d=>d.v)));
  const n = data.length, gw = iw/n, k = colors.length, bw = Math.min(26, (gw*0.72)/k);
  let g = '';
  for(let i=0;i<=4;i++){
    const y = T+ih-ih*i/4;
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink-soft)">${shortNum(max*i/4)}</text>`;
  }
  data.forEach((d,i)=>{
    const cx = L+gw*i+gw/2;
    d.v.forEach((val,j)=>{
      const h = ih*val/max, x = cx-(k*bw)/2+j*bw;
      g += `<rect x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${colors[j]}"><title>${esc(d.label)} — ${esc(names[j])}: ${numPlain(val)}</title></rect>`;
    });
    g += `<text x="${cx.toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="${esc(aria||'chart')}">${g}</svg>`;
}
function hBars(rows){
  const max = Math.max(1, ...rows.map(r=>r.value));
  return `<div class="hbars">${rows.map(r=>`<div class="hbar-row"><div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}${r.sub?`<span class="hbar-sub">${esc(r.sub)}</span>`:''}</div><div class="hbar-track"><div class="hbar-fill ${r.cls||''}" style="width:${Math.max(1.5, r.value/max*100).toFixed(1)}%"></div></div><div class="hbar-val">${esc(r.text)}</div></div>`).join('')}</div>`;
}
function monthKeyOf(d){ return /^\d{4}-\d{2}/.test(d||'') ? d.slice(0,7) : null; }
function monthLabel(m){ return new Date(+m.slice(0,4), +m.slice(5,7)-1, 1).toLocaleDateString('en-GB', {month:'short', year:'2-digit'}); }
function inRangeE(e, df, dt){ return inDateRange(e, df||'', dt||''); }
function monthlyTrend(keys, maxMonths, df, dt){
  const agg = {};
  keys.forEach(bk=>getSales(bk).forEach(e=>{
    if(!inRangeE(e, df, dt)) return;
    const m = monthKeyOf(e.date); if(!m) return;
    const a = agg[m] || (agg[m] = {total:0, promo:0, count:0});
    a.total += Number(e.total)||0; a.promo += entryPromoAmount(bk, e); a.count++;
  }));
  const ms = Object.keys(agg).sort();
  if(!ms.length) return [];
  const last = ms[ms.length-1], out = [];
  let y = +last.slice(0,4), mo = +last.slice(5,7);
  for(let i=0; i<(maxMonths||12); i++){
    const key = y+'-'+String(mo).padStart(2,'0');
    if(key < ms[0]) break;
    out.unshift({m:key, label:monthLabel(key), ...(agg[key]||{total:0, promo:0, count:0})});
    mo--; if(mo===0){ mo = 12; y--; }
  }
  return out;
}
function rankSalesmen(keys, scope, df, dt){
  const rows = [];
  keys.forEach(bk=>{
    if(scope==='period'){
      allAccountStats(bk).forEach(s=>{ if(s.periodTotal>0) rows.push({biz:bk, name:s.name, value:s.periodTotal, pct:s.pct, target:s.target}); });
    } else {
      const agg = {};
      getSales(bk).forEach(e=>{ if(inRangeE(e, df, dt)) agg[e.salesman] = (agg[e.salesman]||0) + (Number(e.total)||0); });
      Object.keys(agg).forEach(n=>{ if(agg[n]>0) rows.push({biz:bk, name:n, value:agg[n], pct:0, target:0}); });
    }
  });
  return rows.sort((a,b)=>b.value-a.value);
}
/* Every product that sold (best first) and, separately, every product in Product Details that did not sell.
   Total amount = quantity sold × the product's price in Product Details. */
function rankProducts(keys, df, dt, sortBy){
  const map = new Map(), soldIds = new Set();
  keys.forEach(bk=>{
    const prods = getProducts(bk);
    getSales(bk).forEach(e=>{
      if(!inRangeE(e, df, dt)) return;
      (e.items||[]).forEach(it=>{
        const q = Number(it.qty)||0; if(!q) return;
        const p = productFor(prods, it);
        const k = bk+'|'+(p ? p.id : (it.modelNumber||it.productName));
        const r = map.get(k) || {biz:bk, name:(p?p.productName:it.productName)||it.modelNumber||'(unnamed)', model:p?p.modelNumber:(it.modelNumber||''), qty:0, amount:0, price:p?(Number(p.price)||0):0, inMaster:!!p};
        r.qty += q; r.amount += r.price*q;
        map.set(k, r);
        if(p) soldIds.add(bk+'|'+p.id);
      });
    });
  });
  const sold = Array.from(map.values()).sort(sortBy==='qty' ? (a,b)=>b.qty-a.qty || b.amount-a.amount : (a,b)=>b.amount-a.amount || b.qty-a.qty);
  const unsold = [];
  keys.forEach(bk=>getProducts(bk).forEach(p=>{ if(!soldIds.has(bk+'|'+p.id)) unsold.push({biz:bk, name:p.productName||'', model:p.modelNumber||'', stock:Number(p.quantity)||0, price:Number(p.price)||0}); }));
  unsold.sort((a,b)=>a.name.localeCompare(b.name));
  return {sold, unsold};
}

function analyticsTables(){
  const keys = anKeys(), df = anState.from, dt = anState.to, multi = anState.biz==='all';
  const pace = paceRows(keys).map(r=>[bizName(r.bk), targetPeriodLabel(r.bk), fmtMoney(r.achieved), fmtMoney(r.target), r.pct+'%',
    r.pc.state==='running' ? fmtMoney(r.pc.projected)+' ('+r.pc.projPct+'%)' : paceLabel(r.pc), r.pc.left!=null ? r.pc.left : '', r.pc.state==='running' && r.pc.left>0 ? fmtMoney(r.pc.perDay) : '']);
  const trend = monthlyTrend(keys, 12, df, dt);
  const rank = rankSalesmen(keys, anState.scope, df, dt);
  const {sold, unsold} = rankProducts(keys, df, dt, anState.sort);
  return {keys, multi, trend, rank, sold, unsold, pace,
    paceHead:['Business','Target period','Achieved','Target','Achieve %','Projected at period end','Days left','Needed per day'],
    trendHead:['Month','Total sales','Promotional sales','Memos'], trendRows:trend.map(t=>[t.label, fmtMoney(t.total), fmtMoney(t.promo), t.count]),
    rankHead:['#','Salesman'].concat(multi?['Business']:[]).concat(['Amount'], anState.scope==='period'?['Achieve %']:[]),
    rankRows:rank.map((r,i)=>[i+1, r.name].concat(multi?[bizName(r.biz)]:[]).concat([fmtMoney(r.value)], anState.scope==='period'?[r.pct+'%']:[])),
    soldHead:['#','Product','Model No.'].concat(multi?['Business']:[]).concat(['Qty sold','Price','Total amount']),
    soldRows:sold.map((r,i)=>[i+1, r.name, r.model].concat(multi?[bizName(r.biz)]:[]).concat([r.qty, r.inMaster?fmtMoney(r.price):'—', fmtMoney(r.amount)])),
    unsoldHead:['#','Product','Model No.'].concat(multi?['Business']:[]).concat(['In stock','Price']),
    unsoldRows:unsold.map((r,i)=>[i+1, r.name, r.model].concat(multi?[bizName(r.biz)]:[]).concat([r.stock, fmtMoney(r.price)]))};
}
function analyticsScopeLine(t, withRange){
  return `<div style="font-size:13px; margin-bottom:8px;"><b>Scope:</b> ${esc(t.multi?'All businesses':bizName(anState.biz))} &nbsp; ${withRange?`<b>Date range:</b> ${esc(anRangeLabel())} &nbsp; `:''}<b>Printed:</b> ${esc(new Date().toLocaleString())}</div>`;
}
/* one print for Target pace + Month-wise trend + Salesman ranking */
function analyticsOverviewPrintHtml(){
  const t = analyticsTables();
  const chart = t.trend.length ? svgColumns(t.trend.map(x=>({label:x.label, v:[x.total, x.promo]})), ['#0FB5A6','#C99B3F'], ['Total sales','Promotional sales'], 'Month-wise sales trend').replace(/var\(--line\)/g,'#E3E6F0').replace(/var\(--ink-soft\)/g,'#4B5563') : '';
  return analyticsScopeLine(t, true)
    + `<div style="font-size:12px; color:#4B5563; margin-bottom:6px;">Target pace follows each business's session period; the date range applies to the trend and to the ranking when it is set to “All memos”.</div>

    <h3>Month-wise trend</h3>${chart ? `<div style="max-width:720px;">${chart}</div>` : ''}${tableHtml(t.trendHead, t.trendRows)}

function analyticsSoldPrintHtml(){
  const t = analyticsTables(), totAmt = t.sold.reduce((a,r)=>a+r.amount,0), totQty = t.sold.reduce((a,r)=>a+r.qty,0);
  const rows = t.soldRows.concat(t.sold.length ? [['Total','',''].concat(t.multi?['']:[]).concat([totQty, '', fmtMoney(totAmt)])] : []);

    + `<div style="font-size:12px; color:#4B5563; margin-bottom:6px;">${t.sold.length} product(s) sold, highest ${anState.sort==='qty'?'quantity':'amount'} first. Total amount = quantity sold × price in Product Details.</div>`
    + tableHtml(t.soldHead, rows);
}
function analyticsUnsoldPrintHtml(){
  const t = analyticsTables();
  return analyticsScopeLine(t, true)
    + `<div style="font-size:12px; color:#4B5563; margin-bottom:6px;">${t.unsold.length} product(s) in Product Details with no sales ${(anState.from||anState.to)?'in this date range':'yet'}.</div>`
    + tableHtml(t.unsoldHead, t.unsoldRows);
}
function analyticsExcel(){
  const t = analyticsTables();
  if(typeof XLSX==='undefined'){ csvDownload(t.soldHead, t.soldRows, 'promaxis_product_wise_sales_'+todayStr()); toast('Excel library is not loaded (no internet) — saved the product-wise list as CSV.'); return; }
  try{
    const wb = XLSX.utils.book_new();
    const add = (name, head, rows)=>XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...(rows.length?rows:[[]])]), name);
    add('Product-wise sales', t.soldHead, t.soldRows); add('Products not sold', t.unsoldHead, t.unsoldRows);
    add('Salesman ranking', t.rankHead, t.rankRows); add('Month-wise trend', t.trendHead, t.trendRows); add('Target pace', t.paceHead, t.pace);
    XLSX.writeFile(wb, 'promaxis_analytics_'+todayStr()+'.xlsx'); toast('Excel file downloaded');
  }catch(e){ toast('Excel export failed: '+e.message, 'danger'); }
}

function fmtWhen(ts){ try{ return new Date(ts).toLocaleString([], {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}); }catch(e){ return ts; } }
function renderBin(){
  setTitle('Recycle Bin');

  view.innerHTML = `
    <p class="text-soft" style="font-size:13px; margin-bottom:12px;">Deleted memos and products wait here for ${TRASH_KEEP_DAYS} days before they are removed for good. Restore any of them, even after a “Clear Account Data”.</p>
    <div class="toolbar"><span class="badge-count">${bin.length} item(s)</span><span class="spacer"></span><button class="btn btn-danger" id="btnEmptyBin" type="button" ${bin.length?'':'disabled'}>Empty Recycle Bin</button></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Deleted</th><th>Business</th><th>What</th><th>Details</th><th>Actions</th></tr></thead><tbody>
      ${bin.length ? bin.map(it=>{
        const isSale = it.type==='sale', n = it.recs.length;
        const preview = it.recs.slice(0,4).map(r=>isSale ? `${esc(r.memo)} · ${esc(r.salesman)} · ${fmtMoney(r.total)}` : `${esc(r.productName)} · ${esc(r.modelNumber)}`).join('<br>');
        return `<tr><td>${esc(fmtWhen(it.ts))}<div class="text-soft" style="font-size:11.5px;">${esc(it.dev||'')}</div></td><td>${esc(bizName(it.biz))}</td>
          <td><span class="pill ${isSale?'pill-info':'pill-warn'}">${n} ${isSale?'memo':'product'}${n===1?'':'s'}</span>${it.label?`<div class="text-soft" style="font-size:12px; margin-top:3px;">${esc(it.label)}</div>`:''}</td>
          <td style="font-size:12.5px;">${preview}${n>4?`<div class="text-soft">…and ${n-4} more</div>`:''}</td>
          <td><button class="btn btn-sm btn-primary" data-bin-restore="${it.id}" type="button">Restore</button> <button class="btn btn-sm btn-danger" data-bin-del="${it.id}" type="button">Delete forever</button></td></tr>`;
      }).join('') : `<tr><td colspan="5">${emptyState('🗑️','Recycle Bin is empty','Anything you delete will show up here first.')}</td></tr>`}
    </tbody></table></div>`;
  view.querySelectorAll('[data-bin-restore]').forEach(b=>b.onclick = ()=>{ if(restoreTrashItem(b.dataset.binRestore)){ toast('Restored'); renderBin(); } });

    tombAdd(Store.get('trash', []).map(x=>x.id)); Store.set('trash', []); toast('Recycle Bin emptied', 'danger'); renderBin();
  });
}

function contractorRows(df, dt){
  const map = new Map();
  BUSINESSES.forEach(b=>getSales(b.key).forEach(e=>{
    if(!inDateRange(e, df, dt)) return;
    const ct = (e.contractor||'').trim(), cp = entryCtPromo(b.key, e);
    if(!ct && !cp) return;
    const name = ct || '(No contractor selected)';
    const c = map.get(name) || {name, memos:0, total:0, promo:0, biz:new Map()};
    const bz = c.biz.get(b.key) || {memos:0, total:0, promo:0};
    [c, bz].forEach(x=>{ x.memos++; x.total += Number(e.total)||0; x.promo += cp; });
    c.biz.set(b.key, bz); map.set(name, c);
  }));
  return Array.from(map.values()).sort((a,b)=>b.promo-a.promo);
}

/* ---------- WhatsApp messages (Bangla templates) ---------- */
const WA_DEFAULT = {
  status:"Dear {name},\n{business} — Target status ({period})\nTarget: {target}\nAchieved: {achieved} ({pct}%)\nRemaining: {remaining}\nThank you.",
  remind:"Dear {name}, only {days_left} day(s) are left to complete your {business} target. {remaining} is still remaining (achieved {pct}%). To reach the target you need to sell about {per_day} per day. We count on your best effort. Thank you.",
  congrats:"Congratulations {name}! 🎉 You have achieved your {business} target — {achieved} ({pct}%).{incentive_line} Thank you."
};
const WA_VARS = ['name','business','period','target','achieved','pct','remaining','days_left','per_day','projected_pct','incentive','incentive_line','date'];
function waTemplates(){ return Object.assign({}, WA_DEFAULT, Store.get('wa_tpl', {})); }
const phoneKey = (biz, name)=>biz+'||'+name;
function getPhone(biz, name){ return (Store.get('phones', {})||{})[phoneKey(biz, name)] || ''; }
function setPhone(biz, name, v){
  const p = Store.get('phones', {});
  if(v) p[phoneKey(biz, name)] = v; else delete p[phoneKey(biz, name)];
  Store.set('phones', p);
}
function waNumber(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.indexOf('00')===0) d = d.slice(2);
  if(d.indexOf('880')===0) return d;
  if(d.charAt(0)==='0') return '88'+d;
  if(d.length===10 && d.charAt(0)==='1') return '880'+d;
  return d;
}
function waLink(phone, text){ const n = waNumber(phone); return 'https://wa.me/'+(n?n:'')+'?text='+encodeURIComponent(text); }
const moneyPlain = n => (getSettings().currency||'৳')+Math.round(Number(n)||0).toLocaleString('en-US');
const moneyExact = n => (getSettings().currency||'৳')+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
function waVars(bk, name){
  const st = salesmanStats(bk, name), pc = paceInfo(bk, st.periodTotal, st.target), inc = st.incentive;
  return {name, business:bizName(bk), period:targetPeriodLabel(bk), target:moneyPlain(st.target), achieved:moneyPlain(st.periodTotal), pct:String(st.pct),
    remaining:moneyPlain(Math.max(0, st.target-st.periodTotal)), days_left:pc.left!=null ? String(pc.left) : '—', per_day:pc.perDay!=null ? moneyPlain(pc.perDay) : '—',
    projected_pct:pc.projPct!=null ? String(pc.projPct) : '—', incentive:inc && inc.slab ? moneyExact(inc.amount) : '',
    incentive_line:inc && inc.slab ? ' Your incentive: '+moneyExact(inc.amount)+'.' : '', date:fmtDateNice(todayStr())};
}
function waFill(tpl, vars){ return String(tpl).replace(/\{(\w+)\}/g, (m,k)=>vars[k]!==undefined ? vars[k] : m); }
function waAutoKey(bk, name){
  const st = salesmanStats(bk, name), pc = paceInfo(bk, st.periodTotal, st.target);
  if(st.pct>=100) return 'congrats';
  if(pc.state==='running' && pc.projPct<100) return 'remind';
  return 'status';
}
const WA_KEY_LABEL = {status:'Status update', remind:'Reminder (behind pace)', congrats:'Congratulations'};
function waSentToday(){ return Store.get('wa_sent_'+todayStr(), {}); }
function markWaSent(bk, name){ const s = waSentToday(); s[phoneKey(bk,name)] = true; Store.set('wa_sent_'+todayStr(), s); }

        <div class="field"><label>Message type</label><select id="waKey">${Object.keys(WA_KEY_LABEL).map(k=>`<option value="${k}" ${k===key?'selected':''}>${WA_KEY_LABEL[k]}${k===key?' (suggested)':''}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Message <span class="text-soft" style="font-weight:400;">(you can edit before sending)</span></label><textarea id="waMsg" rows="9" style="width:100%; font-family:inherit;"></textarea></div>

        const rows = names.map(n=>({n, st:salesmanStats(bk, n)})).filter(r=>!waBulkOnlyBehind || r.st.pct<100).sort((a,b)=>a.st.pct-b.st.pct);
        document.getElementById('waBulkList').innerHTML = rows.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Salesman</th><th class="right">Achieved</th><th class="right">%</th><th>Number</th><th>Message</th><th></th></tr></thead><tbody>
          ${rows.map(r=>{ const done = sent[phoneKey(bk,r.n)], ph = getPhone(bk,r.n); return `<tr style="${done?'background:#E4F8F3;':''}"><td>${esc(r.n)}</td><td class="right mono">${fmtMoney(r.st.periodTotal)}</td><td class="right mono">${r.st.pct}%</td><td class="mono">${ph?esc(ph):'<span class="text-soft">no number</span>'}</td><td>${WA_KEY_LABEL[waAutoKey(bk,r.n)]}</td>
            <td><button class="btn btn-sm ${done?'btn-ghost':'btn-primary'}" data-wa-send="${esc(r.n)}" type="button">${done?'Sent ✓':(ph?'Send':'Pick contact')}</button></td></tr>`; }).join('')}
          </tbody></table></div>` : emptyState('🎉','Everyone is at or above target','Untick the box above to message all accounts anyway.');
        api.overlay.querySelectorAll('[data-wa-send]').forEach(b=>b.onclick = ()=>{
          const n = b.dataset.waSend;

          markWaSent(bk, n); window.open(waLink(getPhone(bk,n), text), '_blank', 'noopener'); draw();
        });
      };
      document.getElementById('waOnlyBehind').onchange = e=>{ waBulkOnlyBehind = e.target.checked; draw(); };
      draw();
    }
  });
}

function wireSettingsExtra(){
  const v = document.getElementById('view');
  document.getElementById('btnSaveStock').onclick = ()=>{
    Store.set('stock_cfg', {auto:document.getElementById('stAuto').checked, alerts:document.getElementById('stAlerts').checked, low:Math.max(0, Number(document.getElementById('stLow').value)||0)});
    toast('Stock settings saved'); renderSettings();
  };
  const readSlabs = ()=>Array.from(v.querySelectorAll('#slabRows .slab-row')).map((row,i)=>({
    pct:Number(row.querySelector(`[data-slab-pct="${i}"]`).value)||0,
    type:row.querySelector(`[data-slab-type="${i}"]`).value,
    value:Number(row.querySelector(`[data-slab-val="${i}"]`).value)||0})).filter(s=>s.pct>0);
  const keepEdits = ()=>{ const c = incentiveCfg(); const s = readSlabs();
    if(incUiScope==='default') c.slabs = s.length ? s : DEFAULT_SLABS; else { c.byBiz = c.byBiz||{}; c.byBiz[incUiScope] = s; }
    c.enabled = document.getElementById('incOn').checked; c.base = document.getElementById('incBase').value; return c; };
  document.getElementById('incScope').onchange = e=>{ Store.set('incentive_cfg', keepEdits()); incUiScope = e.target.value; renderSettings(); };
  document.getElementById('btnSlabAdd').onclick = ()=>{ const c = keepEdits(); const arr = incUiScope==='default' ? c.slabs : c.byBiz[incUiScope]; arr.push({pct:(arr.length?Math.max(...arr.map(s=>s.pct))+20:80), type:'percent', value:0}); Store.set('incentive_cfg', c); renderSettings(); };
  v.querySelectorAll('[data-slab-del]').forEach(b=>b.onclick = ()=>{ const c = keepEdits(); const arr = incUiScope==='default' ? c.slabs : c.byBiz[incUiScope]; arr.splice(Number(b.dataset.slabDel), 1); if(incUiScope==='default' && !arr.length) c.slabs = DEFAULT_SLABS; Store.set('incentive_cfg', c); renderSettings(); });
  document.getElementById('btnSaveInc').onclick = ()=>{ Store.set('incentive_cfg', keepEdits()); auditAdd([{act:'edit', txt:'Incentive slab settings changed'}]); toast('Incentive settings saved'); renderSettings(); };
  const rs = document.getElementById('btnSlabReset'); if(rs) rs.onclick = ()=>{ const c = incentiveCfg(); c.byBiz = c.byBiz||{}; delete c.byBiz[incUiScope]; Store.set('incentive_cfg', c); toast('This business now uses the default slabs'); renderSettings(); };
  document.getElementById('btnSaveWa').onclick = ()=>{
    const t = {}; v.querySelectorAll('[data-wa-tpl]').forEach(el=>{ t[el.dataset.waTpl] = el.value; });
    Store.set('wa_tpl', t); toast('Templates saved');
  };
  document.getElementById('btnResetWa').onclick = ()=>{ Store.del('wa_tpl'); toast('Default wording restored'); renderSettings(); };
  const nr = document.getElementById('btnNewRecovery');
  if(nr) nr.onclick = ()=>{
    const cur = document.getElementById('secCurPass').value;
    if(!verifyPassword(cur)){ toast('Type your current password in the field above first', 'danger'); return; }
    if(!getAuth()){ const k = setPasswordAndKey(cur, null); showRecoveryKeyModal(k, 'Your password is now stored securely and this is your recovery key.'); renderSettings(); return; }
    const key = regenRecoveryKey();
    showRecoveryKeyModal(key, 'The previous recovery key no longer works. This is the new one.');
  };
}

/* ---------------- Global keyboard shortcuts ----------------
   Ctrl/Cmd+↑  : jump to the top of the current scroll area
   Ctrl/Cmd+↓  : jump to the bottom of the current scroll area
   Ctrl/Cmd+F  : focus this page's search box (if it has one)
   Ctrl/Cmd+Enter : on a page with an "+ Add …" button (Add Entry, Add
     Product) and no modal open, opens it. Inside the Add Sales Entry
     modal this key is instead handled by that modal's own listener,
     which commits the entry immediately (see openSalesEntryModal).
   Backspace : while not typing in a field and no modal is open, acts
     like the page's "← All Accounts" button, if present.
   The scroll area is the topmost open modal's body when a modal is open,
   otherwise the main page. */
function activeScrollEl(){
  const overlays = document.querySelectorAll('#modalRoot .modal-overlay');
  if(overlays.length){
    const last = overlays[overlays.length-1];
    const body = last.querySelector('.modal-body');
    if(body) return body;
  }
  return document.scrollingElement || document.documentElement;
}
function installGlobalShortcuts(){
  document.addEventListener('keydown', (e)=>{
    const overlays = document.querySelectorAll('#modalRoot .modal-overlay');
    if(e.key==='Backspace' && !e.ctrlKey && !e.metaKey && overlays.length===0){
      const tag = (e.target.tagName||'').toLowerCase();
      const typing = tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable;
      if(!typing){
        const backBtn = document.getElementById('btnBackAccts');
        if(backBtn){ e.preventDefault(); backBtn.click(); return; }
      }
    }
    if(!e.ctrlKey && !e.metaKey) return;
    if(e.key==='ArrowUp'){
      e.preventDefault();
      activeScrollEl().scrollTo({top:0, behavior:'smooth'});
    } else if(e.key==='ArrowDown'){
      e.preventDefault();
      const el = activeScrollEl();
      el.scrollTo({top:el.scrollHeight, behavior:'smooth'});
    } else if(e.key.toLowerCase()==='f'){
      const box = document.getElementById('searchInput');
      if(box){
        e.preventDefault();
        box.focus();
        if(box.select) box.select();
      }
      /* If this page has no search box, let the browser's own Ctrl+F run as normal. */
    } else if(e.key==='Enter' && overlays.length===0){
      const addBtn = document.getElementById('btnAdd');
      if(addBtn){ e.preventDefault(); addBtn.click(); }
    }
  });
}

/* ---------------- Press-and-hold Up/Down on any <select> ----------------
   A single Up/Down press already moves one option (native browser
   behaviour). But whether *holding* the key keeps stepping depends on the
   device/keyboard sending repeated keydown events, which some on-screen
   keyboards don't. So this takes over stepping itself: the first press
   moves one step as before, and if the key is still down after a short
   delay, it keeps stepping on its own timer until the key is released —
   working the same way no matter which interface (page or modal) is open,
   since it's wired once at the document level. */
function installSelectArrowHold(){
  let heldKey = null, heldSelect = null, startTimer = null, repeatTimer = null;
  function stepSelect(select, dir){
    const opts = select.options;
    if(!opts || opts.length===0) return;
    const next = Math.max(0, Math.min(opts.length-1, select.selectedIndex + dir));
    if(next===select.selectedIndex) return; /* already at the top/bottom — stop there, no wrap-around */
    select.selectedIndex = next;
    select.dispatchEvent(new Event('change', {bubbles:true}));
  }
  function clearHold(){
    if(startTimer) clearTimeout(startTimer);
    if(repeatTimer) clearInterval(repeatTimer);
    startTimer = null; repeatTimer = null; heldKey = null; heldSelect = null;
  }
  document.addEventListener('keydown', (e)=>{
    if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
    const el = e.target;
    if(!el || el.tagName!=='SELECT' || el.disabled) return;
    e.preventDefault();
    if(heldKey===e.key && heldSelect===el) return; /* already stepping this hold — ignore any repeat keydowns the OS also sends */
    clearHold();
    heldKey = e.key; heldSelect = el;
    const dir = e.key==='ArrowDown' ? 1 : -1;
    stepSelect(el, dir);
    startTimer = setTimeout(()=>{ repeatTimer = setInterval(()=>stepSelect(el, dir), 90); }, 380);
  });
  document.addEventListener('keyup', (e)=>{ if(e.key===heldKey) clearHold(); });
  window.addEventListener('blur', clearHold);
}
