    <p class="hint" style="margin:4px 0 10px;">If a memo has more than one promotional product, add every product as its own row inside the <b>same</b> entry — entering them as separate memos will be flagged <b>Duplicate</b> in red below; a clean, unique memo shows <b>OK</b> in green.${isTarget ? ` Only memos dated within the target period (<b>${esc(targetPeriodLabel(bizKey))}</b>) are listed below — Promotional Sales memos in this period are pulled in automatically, and any memo added here counts only toward Sales Target, not Promotional Sales.` : ''}</p>

    <div class="table-wrap">
      <table class="data-table" id="salesTable">
        <thead><tr><th class="sel-cell"><input type="checkbox" id="selAllEntries"/></th><th>SL</th><th>Date</th><th>Memo No.</th><th>Products</th><th class="right">Total Amount</th><th class="right">Promo Amount</th>${showCt?'<th class="right">Contractor Promo</th>':''}<th>Status</th><th>Actions</th></tr></thead>
        <tbody id="salesTbody"></tbody>
      </table>
    </div>
  `;

  function baseAcctEntries(){
    return acctBaseEntries(bizKey, name, mode);
  }
  const selectedIds = new Set();
  function currentFiltered(){
    const base = baseAcctEntries();
    const dupIds = computeDuplicateKeys(base);
    return sortEntries(filterAcctSales(base, avs, bizKey, dupIds), avs.sortBy||'date', avs.sortDir||'asc', bizKey, dupIds);
  }
  function refreshTable(){
    const acctEntries = baseAcctEntries();
    const dupIds = computeDuplicateKeys(acctEntries);
    /* SL always reflects the memo's true position in this account's full
       chronological list — never renumbered to 1,2,3… of just the filtered
       search results, so the same memo always shows the same SL everywhere
       (this table, print/PDF, and the Duplicate Memo Summary). */
    const slMap = acctSlMap(bizKey, name, mode);
    const filtered = currentFiltered();
    const tbody = document.getElementById('salesTbody');
    const emptyMsg = isTarget
      ? emptyState('📅', 'No memos in this target period', `Only memos dated within ${esc(targetPeriodLabel(bizKey))} appear here — Promotional Sales memos in this period are pulled in automatically, or add one directly with "+ Add Entry".`)
      : emptyState('📝', 'No entries yet', 'Click “+ Add Entry” to record this salesman\'s first promotional sales memo.');
    tbody.innerHTML = filtered.length===0
      ? `<tr><td colspan="${showCt?10:9}">${emptyMsg}</td></tr>`
      : filtered.map((e)=>{
          const isDup = dupIds.has(e.id);
          const prodSummary = (e.items||[]).map(it=>`${esc(it.productName||it.modelNumber)} ×${it.qty}`).join(', ');
          return `<tr data-id="${e.id}" class="row-clickable ${isDup?'row-duplicate':''}" title="Click to open this memo">
            <td class="sel-cell"><input type="checkbox" class="rowSelEntry" data-id="${e.id}" ${selectedIds.has(e.id)?'checked':''}/></td>
            <td class="mono">${slMap.get(e.id)||''}</td>
            <td class="mono">${esc(e.date)}</td>
            <td class="mono">${esc(e.memo)}</td>
            <td>${prodSummary || '<span class="text-soft">—</span>'}</td>
            <td class="right mono">${fmtMoney(e.total)}</td>
            <td class="right mono">${fmtMoney(entryPromoAmount(bizKey,e))}</td>
            ${showCt ? `<td class="right mono">${fmtMoney(entryCtPromo(bizKey,e))}${e.contractor?`<div class="text-soft" style="font-size:11px; font-family:var(--font-body);">${esc(e.contractor)}</div>`:''}</td>` : ''}
            <td><span class="pill ${isDup?'pill-dup':'pill-ok'}">${isDup?'Duplicate':'OK'}</span></td>
            <td><button class="btn btn-sm btn-ghost" data-edit="${e.id}" type="button">Edit</button> <button class="btn btn-sm btn-danger" data-del="${e.id}" type="button">Delete</button></td>
          </tr>`;
        }).join('');
    const selAllBox = document.getElementById('selAllEntries');
    function refreshSelAllBox(){
      if(!selAllBox) return;
      const shownIds = filtered.map(e=>e.id);
      selAllBox.checked = shownIds.length>0 && shownIds.every(id=>selectedIds.has(id));
    }
    refreshSelAllBox();
    if(selAllBox){
      selAllBox.onclick = ()=>{
        const shownIds = filtered.map(e=>e.id);
        if(selAllBox.checked) shownIds.forEach(id=>selectedIds.add(id));
        else shownIds.forEach(id=>selectedIds.delete(id));
        refreshTable();
      };
    }
    /* The checkbox itself is a small target — on a phone, a tap that's a
       few pixels off can miss it and land on the row instead, which used
       to open the memo editor rather than mark the row for transfer. The
       whole first cell is now a reliable tap target for toggling it. */
    tbody.querySelectorAll('td.sel-cell').forEach(td=>{
      const cb = td.querySelector('.rowSelEntry');
      td.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(ev.target!==cb) cb.checked = !cb.checked;
        cb.checked ? selectedIds.add(cb.dataset.id) : selectedIds.delete(cb.dataset.id);
        refreshSelAllBox();
      });
    });
    /* Clicking anywhere on a memo's row (after searching or otherwise) opens
       it directly — not just the small Edit button. */
    tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
      tr.addEventListener('click', (ev)=>{
        if(ev.target.closest('button') || ev.target.closest('input')) return;
        openSalesEntryModal(bizKey, tr.dataset.id, name, mode);
      });
    });
    tbody.querySelectorAll('[data-edit]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); openSalesEntryModal(bizKey, b.dataset.edit, name, mode); });
    tbody.querySelectorAll('[data-del]').forEach(b=>b.onclick=(ev)=>{
      ev.stopPropagation();
      confirmDialog('Delete this entry?','The memo moves to the Recycle Bin (kept 60 days, with an Undo right after) and its products are added back to stock.', ()=>{
        saveSales(bizKey, getSales(bizKey).filter(e=>e.id!==b.dataset.del));
        const tid = _lastTrashId;
        selectedIds.delete(b.dataset.del);
        undoToast('Entry deleted', tid); refreshTable();
      });
    });
  }
  refreshTable();

  document.getElementById('btnBackAccts').onclick = ()=>{ location.hash = routePrefix+'/'+bizKey; };
  const editTargetBtn = document.getElementById('btnEditTarget');
  if(editTargetBtn) editTargetBtn.onclick = (ev)=>{ ev.preventDefault(); openTargetModal(bizKey, name, ()=>renderSalesAccountView(bizKey, name, mode)); };
  document.getElementById('btnAdd').onclick = ()=>openSalesEntryModal(bizKey, null, name, mode);
  function syncFiltersFromPanel(){
    /* If the filter panel is open (or fields exist), pull latest values so
       Summary / Print / Excel match what the user typed even before Apply. */
    if(document.getElementById('fDateFrom')) readFilterFields();
    const si = document.getElementById('searchInput');
    if(si) avs.search = si.value;
  }
  document.getElementById('btnPrint').onclick = ()=>{
    syncFiltersFromPanel();
    printSalesTable(bizKey, currentFiltered(), name);
  };
  document.getElementById('btnExcel').onclick = ()=>{
    syncFiltersFromPanel();
    exportSalesExcel(bizKey, currentFiltered(), name);
  };
  document.getElementById('btnDup').onclick = ()=>openDuplicateSummary(bizKey, name, mode);
  document.getElementById('btnAcctSummary').onclick = ()=>{
    syncFiltersFromPanel();
    openIndividualSummary(bizKey, name, mode, isFilterActive(avs) ? currentFiltered() : null);
  };
  document.getElementById('btnTransfer').onclick = ()=>openEntryTransferModal(bizKey, name, mode, selectedIds, currentFiltered(), isFilterActive(avs), ()=>renderSalesAccountView(bizKey, name, mode));
  document.getElementById('btnClear').onclick = ()=>{
    confirmDialog(`Clear all sales data for ${esc(name)} in ${esc(bizName(bizKey))}?`, 'Every entry moves to the Recycle Bin, where you can restore it. Stock levels are not changed.', ()=>{
      saveSales(bizKey, getSales(bizKey).filter(e=>e.salesman!==name), {label:'Cleared account '+name, noStockRestore:true});
      undoToast('Account data cleared', _lastTrashId); renderSalesAccountView(bizKey, name, mode);
    });
  };
  const waBtn = document.getElementById('btnWa'); if(waBtn) waBtn.onclick = ()=>openWhatsAppModal(bizKey, name);
  document.getElementById('btnFilter').onclick = ()=>{ avs.filterOpen=!avs.filterOpen; document.getElementById('filterPanel').classList.toggle('open', avs.filterOpen); };
  function readFilterFields(){
    avs.dateFrom = document.getElementById('fDateFrom').value;
    avs.dateTo = document.getElementById('fDateTo').value;
    avs.memoFrom = document.getElementById('fMemoFrom').value;
    avs.memoTo = document.getElementById('fMemoTo').value;
    avs.product = document.getElementById('fProduct').value;
    avs.status = document.getElementById('fStatus').value;
    avs.totalMin = document.getElementById('fTotalMin').value;
    avs.totalMax = document.getElementById('fTotalMax').value;
    avs.promoMin = document.getElementById('fPromoMin').value;
    avs.promoMax = document.getElementById('fPromoMax').value;
    avs.sortBy = document.getElementById('fSortBy').value;
    avs.sortDir = document.getElementById('fSortDir').value;
  }
  document.getElementById('btnApplyFilter').onclick = ()=>{
    readFilterFields();
    avs.filterOpen = true;
    refreshTable();
  };
  document.getElementById('btnSaveFilter').onclick = ()=>{
    readFilterFields();
    saveAVSFilter(bizKey, name, avs);
    avs.filterOpen = true;
    refreshTable();
    toast('Filter saved — it will still be set next time you open this account');
  };
  document.getElementById('btnResetFilter').onclick = ()=>{
    Object.assign(avs, blankAVS(), {search:avs.search, filterOpen:true});
    saveAVSFilter(bizKey, name, avs);
    renderSalesAccountView(bizKey, name, mode);
  };
  /* Search updates only the table body, in place, so typing never loses focus. */
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', ()=>{ avs.search = searchInput.value; refreshTable(); });
  searchInput.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ searchInput.value=''; avs.search=''; refreshTable(); }
  });
}

function openSalesEntryModal(bizKey, entryId, lockedSalesman, mode){
  const newEntrySource = mode==='target' ? 'target' : 'promo';
  const products = getProducts(bizKey);
  const salesmen = getSalesmen(bizKey);
  let existing = entryId ? getSales(bizKey).find(e=>e.id===entryId) : null;
  const contractorList = getContractors().slice();
  if(existing && existing.contractor && !contractorList.includes(existing.contractor)) contractorList.push(existing.contractor);
  const blankItem = ()=>({id:uid(), productName:'', modelNumber:'', qty:1});
  let localItems = existing ? JSON.parse(JSON.stringify(existing.items||[])) : [blankItem()];
  if(localItems.length===0) localItems = [blankItem()];
  /* New (non-edit) entries are staged in a local batch first — nothing is
     written to storage until "Add" is pressed, so the whole memo list you
     build up in one sitting is saved together in a single action. */
  let staged = [];

  function nameOptions(sel){
    const names = distinctProductNames(products);
    if(names.length===0) return `<option value="">— add products first —</option>`;
    return `<option value="">Select product…</option>` + names.map(n=>`<option value="${esc(n)}" ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
  }
  function modelOptions(pname, sel){
    const list = products.filter(p=>!pname || p.productName===pname);
    if(list.length===0) return `<option value="">— select product —</option>`;
    return `<option value="">Select model…</option>` + list.map(p=>`<option value="${esc(p.modelNumber)}" ${p.modelNumber===sel?'selected':''}>${esc(p.modelNumber)}</option>`).join('');
  }
  function rowHtml(it, showLabels){
    return `<div class="prod-row" data-row="${it.id}">
      <div>${showLabels?'<div class="mini-label">Product Name</div>':''}<select class="pr-name">${nameOptions(it.productName)}</select></div>
      <div>${showLabels?'<div class="mini-label">Model No.</div>':''}<select class="pr-model">${modelOptions(it.productName, it.modelNumber)}</select></div>
      <div>${showLabels?'<div class="mini-label">Qty</div>':''}<input type="number" class="pr-qty" min="0" step="1" value="${it.qty}"/></div>
      <button type="button" class="prod-row-remove" data-remove-row title="Remove row" data-noenter>✕</button>
    </div>`;
  }

  const salesmanField = lockedSalesman
    ? `<input type="hidden" id="fSalesman" value="${esc(lockedSalesman)}"/><input type="text" value="${esc(lockedSalesman)}" disabled/>`
    : `<select id="fSalesman"><option value="">Select…</option>${salesmen.map(s=>`<option value="${esc(s)}" ${existing && existing.salesman===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`;

  function stagedListHtml(){
    if(staged.length===0) return '';
    return `<div class="field">
      <label>Staged Entries <span class="text-soft" style="font-weight:400;">(${staged.length} memo${staged.length===1?'':'s'} ready — press "Add" below to save ${staged.length===1?'it':'them all'})</span></label>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Date</th><th>Memo No.</th><th>Products</th><th class="right">Total</th><th>Actions</th></tr></thead>
        <tbody>${staged.map(s=>`<tr>
          <td class="mono">${esc(s.date)}</td><td class="mono">${esc(s.memo)}</td>
          <td>${(s.cleanItems||[]).map(it=>`${esc(it.productName||it.modelNumber)} ×${it.qty}`).join(', ')||'<span class="text-soft">—</span>'}</td>
          <td class="right mono">${fmtMoney(s.total)}</td>
          <td><button class="btn btn-sm btn-ghost" data-edit-staged="${s._stagedId}" type="button">Edit</button> <button class="btn btn-sm btn-danger" data-del-staged="${s._stagedId}" type="button">Delete</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  const bodyHtml = `
    <form id="salesForm" onsubmit="return false;">
      <div class="field"><label>Salesman <span class="badge-count" style="margin-left:6px;">${esc(bizName(bizKey))}</span></label>${salesmanField}</div>
      <div class="field-row-3">
        <div class="field"><label>Date</label><input type="date" id="fDate" value="${existing?existing.date:todayStr()}" required/></div>
        <div class="field"><label>Memo Number</label><input type="text" id="fMemo" value="${existing?esc(existing.memo):''}" placeholder="e.g. 1042" required/></div>
        <div class="field">
          <label>Total Amount <span class="text-soft" style="font-weight:400;">(auto-filled from products — type to override)</span></label>
          <input type="number" min="0" step="0.01" id="fTotal" value="${existing?Number(existing.total).toFixed(2):''}" placeholder="0.00"/>
          <div class="total-calc" id="totalCalc"></div>
        </div>
      </div>
      ${contractorList.length ? `<div class="field"><label>Contractor <span class="text-soft" style="font-weight:400;">(optional — credits contractor promo to this contractor)</span></label><select id="fContractor"><option value="">— none —</option>${contractorList.map(c=>`<option value="${esc(c)}" ${existing&&existing.contractor===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>` : ''}
      <div class="field">
        <label>Promotional Product Sales <span class="text-soft" style="font-weight:400;">(add every product sold under this memo as its own row — up to 100 • <span class="kbd">Tab</span>/<span class="kbd">Enter</span> forward, <span class="kbd">Shift+Tab</span>/<span class="kbd">Backspace</span> back between Product Name and Model No.)</span></label>
        <div id="prodRows">${localItems.map(it=>rowHtml(it, true)).join('')}</div>
        <div class="prod-row" style="margin-top:2px;">
          <div></div><div></div>
          <div><button type="button" class="btn btn-sm btn-ghost" id="btnAddRow" data-noenter style="width:100%;">+ Add Product</button></div>
          <div></div>
        </div>
      </div>
    </form>
    <div id="stagedWrap">${stagedListHtml()}</div>
  `;

  const primaryBtnLabel = existing ? 'Save Changes' : '+ Add to List';
  openModal({
    title: existing ? 'Edit Sales Entry — '+bizName(bizKey) : 'Add Sales Entry — '+bizName(bizKey),
    wide:true, bodyHtml,
    footerHtml: existing
      ? `<button class="btn btn-ghost" data-cancel type="button">Cancel <span class="kbd">Esc</span></button><button class="btn btn-primary" id="btnSaveEntry" type="button">${primaryBtnLabel} <span class="kbd">Enter</span></button>`
      : `<button class="btn btn-ghost" data-cancel type="button">Cancel <span class="kbd">Esc</span></button><button class="btn" id="btnSaveAdd" type="button">${primaryBtnLabel} <span class="kbd">Enter</span></button><button class="btn btn-primary" id="btnAddAll" type="button">✔ Add <span class="kbd">Ctrl+Enter</span></button>`,
    onMount(api){
      /* The Date field is always where you start typing a new memo. */
      setTimeout(()=>{ const d = document.getElementById('fDate'); if(d) d.focus(); }, 30);
      function wireRow(rowEl){
        const it = localItems.find(i=>i.id===rowEl.dataset.row);
        const nameSel = rowEl.querySelector('.pr-name');
        const modelSel = rowEl.querySelector('.pr-model');
        function refreshModel(){ modelSel.innerHTML = modelOptions(it.productName, it.modelNumber); }
        nameSel.onchange = ()=>{
          it.productName = nameSel.value;
          it.modelNumber = '';
          refreshModel();
          const matches = products.filter(p=>p.productName===it.productName);
          if(matches.length===1){ it.modelNumber = matches[0].modelNumber; modelSel.value = it.modelNumber; }
        };
        modelSel.onchange = ()=>{
          it.modelNumber = modelSel.value;
          const m = products.find(p=>p.modelNumber===it.modelNumber);
          if(m){ it.productName = m.productName; nameSel.value = it.productName; refreshModel(); }
        };
        rowEl.querySelector('.pr-qty').addEventListener('input', (e)=>{ it.qty = Number(e.target.value)||0; });
        rowEl.querySelector('[data-remove-row]').onclick = ()=>{
          if(localItems.length<=1){ toast('At least one product row is required','danger'); return; }
          localItems = localItems.filter(i=>i.id!==rowEl.dataset.row);
          rowEl.remove();
        };
      }
      api.overlay.querySelectorAll('.prod-row[data-row]').forEach(wireRow);

      /* ---- v4.6: live total from price × qty, with a mismatch warning ---- */
      let totTouched = !!existing;
      function calcProductsValue(){
        return Math.round(localItems.reduce((a,it)=>{ const p = productFor(products, it); return a + (p ? (Number(p.price)||0)*(Number(it.qty)||0) : 0); }, 0)*100)/100;
      }
      function refreshTotalCalc(){
        const box = document.getElementById('totalCalc'), totEl = document.getElementById('fTotal');
        if(!box || !totEl) return;
        const calc = calcProductsValue();
        if(!totTouched && calc>0) totEl.value = calc.toFixed(2);
        if(calc<=0){ box.innerHTML = ''; return; }
        const typed = Number(totEl.value)||0, diff = Math.round((typed-calc)*100)/100;
        let h = `Products value (price × qty): <b>${fmtMoney(calc)}</b>`;
        if(typed && Math.abs(diff)<0.5) h += ' <span style="color:var(--accent-dark); font-weight:600;">✓ matches</span>';
        else {
          h += ` <button type="button" class="btn btn-sm btn-ghost" id="btnUseCalc" data-noenter>Use this</button>`;
          if(typed && diff<0) h += `<div class="calc-warn">⚠ Total is ${fmtMoney(-diff)} LESS than the value of the products — check the total or the quantities.</div>`;
          else if(typed) h += `<div>Total is ${fmtMoney(diff)} more than these products (other items on the memo?).</div>`;
        }
        box.innerHTML = h;
        const ub = document.getElementById('btnUseCalc');
        if(ub) ub.onclick = ()=>{ totEl.value = calc.toFixed(2); totTouched = true; refreshTotalCalc(); };
      }
      const prodRowsEl = document.getElementById('prodRows');
      ['input','change','click'].forEach(ev=>prodRowsEl.addEventListener(ev, ()=>setTimeout(refreshTotalCalc, 0)));
      document.getElementById('fTotal').addEventListener('input', ()=>{ totTouched = true; refreshTotalCalc(); });
      refreshTotalCalc();

      document.getElementById('btnAddRow').onclick = ()=>{
        if(localItems.length>=100){ toast('Maximum 100 products per entry','danger'); return; }
        const newItem = blankItem();
        localItems.push(newItem);
        const wrap = document.getElementById('prodRows');
        const holder = document.createElement('div');
        holder.innerHTML = rowHtml(newItem, false);
        const rowEl = holder.firstElementChild;
        wrap.appendChild(rowEl);
        wireRow(rowEl);
        rowEl.querySelector('.pr-name').focus();
      };

      api.overlay.querySelector('[data-cancel]').onclick = api.close;

      function resetFormForNext(){
        localItems = [blankItem()];
        document.getElementById('fMemo').value = '';
        document.getElementById('fTotal').value = '';
        const wrap = document.getElementById('prodRows');
        wrap.innerHTML = rowHtml(localItems[0], true);
        wireRow(wrap.firstElementChild);
        totTouched = false; refreshTotalCalc();
        document.getElementById('fDate').focus();
      }
      function renderStaged(){
        document.getElementById('stagedWrap').innerHTML = stagedListHtml();
        wireStagedButtons();
      }
      function wireStagedButtons(){
        api.overlay.querySelectorAll('[data-edit-staged]').forEach(b=>{
          b.onclick = ()=>{
            const idx = staged.findIndex(s=>s._stagedId===b.dataset.editStaged);
            if(idx<0) return;
            const s = staged[idx];
            staged.splice(idx,1);
            document.getElementById('fDate').value = s.date;
            document.getElementById('fMemo').value = s.memo;
            document.getElementById('fTotal').value = Number(s.total).toFixed(2);
            localItems = s.cleanItems.length ? JSON.parse(JSON.stringify(s.cleanItems)) : [blankItem()];
            const wrap = document.getElementById('prodRows');
            wrap.innerHTML = localItems.map(it=>rowHtml(it, true)).join('');
            wrap.querySelectorAll('.prod-row[data-row]').forEach(wireRow);
            totTouched = true; { const fc = document.getElementById('fContractor'); if(fc) fc.value = s.contractor||''; } refreshTotalCalc();
            renderStaged();
            document.getElementById('fDate').focus();
            toast('Loaded back into the form — edit and Add to List again');
          };
        });
        api.overlay.querySelectorAll('[data-del-staged]').forEach(b=>{
          b.onclick = ()=>{
            staged = staged.filter(s=>s._stagedId!==b.dataset.delStaged);
            renderStaged();
          };
        });
      }
      wireStagedButtons();

      function buildEntry(){
        const date = document.getElementById('fDate').value;
        const memo = document.getElementById('fMemo').value.trim();
        const salesman = lockedSalesman || document.getElementById('fSalesman').value;
        const total = Number(document.getElementById('fTotal').value)||0;
        if(!date || !memo){ toast('Date and Memo Number are required','danger'); return null; }
        if(!salesman){ toast('Salesman account is required','danger'); return null; }
        const cleanItems = localItems.filter(i=>i.modelNumber || i.productName).map(i=>({id:i.id, modelNumber:i.modelNumber, productName:i.productName, qty:Number(i.qty)||0}));
        const contractor = (document.getElementById('fContractor')||{}).value || '';
        return {date, memo, salesman, total, cleanItems, contractor};
      }
      function doSaveExisting(){
        const data = buildEntry(); if(!data) return;
        const list = getSales(bizKey);
        const idx = list.findIndex(e=>e.id===existing.id);
        list[idx] = {...existing, date:data.date, memo:data.memo, salesman:data.salesman, items:data.cleanItems, total:data.total, contractor:data.contractor};
        saveSales(bizKey, list);
        toast('Entry updated');
        api.close();
        route();
      }
      function doAddToList(){
        const data = buildEntry(); if(!data) return;
        staged.push({...data, _stagedId:uid()});
        toast('Added to list — keep entering, or press Add to save all');
        resetFormForNext();
        renderStaged();
      }
      /* Commits the whole staged batch. If the form currently has an
         unsaved-but-valid entry in it, that's folded in too, so nothing
         typed gets lost just because "Add to List" wasn't clicked first. */
      function doAddAllAndClose(){
        const memoTyped = document.getElementById('fMemo').value.trim();
        if(memoTyped){
          const data = buildEntry();
          if(!data) return; // buildEntry already toasted the validation error
          staged.push({...data, _stagedId:uid()});
        }
        if(staged.length===0){ toast('Add at least one entry first','danger'); return; }
        const list = getSales(bizKey);
        staged.forEach(s=>{
          list.push({id:uid(), date:s.date, memo:s.memo, salesman:s.salesman, items:s.cleanItems, total:s.total, source:newEntrySource, ...(s.contractor ? {contractor:s.contractor} : {})});
        });
        saveSales(bizKey, list);
        toast(staged.length===1 ? 'Entry added' : staged.length+' entries added');
        api.close();
        route();
      }

      if(existing){
        document.getElementById('btnSaveEntry').onclick = doSaveExisting;
      } else {
        document.getElementById('btnSaveAdd').onclick = doAddToList;
        document.getElementById('btnAddAll').onclick = doAddAllAndClose;
      }

      /* Enter moves field-to-field, then on the last field: stages the entry
         (existing behavior for a fresh memo) so the flow never gets
         interrupted; Shift+Enter or Ctrl/Cmd+Enter (or the ✔ Add button)
         commits everything immediately from anywhere in the form.
         Editing a single existing entry just saves and closes on Enter.
         Backspace mirrors this backwards, but only while a <select> field
         (Product Name, Model No.) is focused — never inside a text/number/
         date field, where Backspace must keep deleting characters as
         normal. (Shift+Tab already moves backward through every field
         type natively; this just gives the same one-key ease as Enter
         specifically for the select fields shown in the screenshot.) */
      api.overlay.addEventListener('keydown', (e)=>{
        if(e.key==='Backspace'){
          if(e.target.tagName.toLowerCase()!=='select') return;
          e.preventDefault();
          const focusables = Array.from(api.overlay.querySelectorAll('input, select, textarea'))
            .filter(el=>!el.disabled && el.offsetParent!==null);
          const idx = focusables.indexOf(e.target);
          if(idx > 0){
            focusables[idx-1].focus();
            if(focusables[idx-1].select) focusables[idx-1].select();
          }
          return;
        }
        if(e.key!=='Enter') return;
        if(e.ctrlKey || e.metaKey){
          e.preventDefault();
          if(existing) doSaveExisting(); else doAddAllAndClose();
          return;
        }
        const tag = e.target.tagName.toLowerCase();
        if(tag==='textarea' || tag==='button') return;
        if(e.target.dataset && e.target.dataset.noenter) return;
        e.preventDefault();
        const focusables = Array.from(api.overlay.querySelectorAll('input, select, textarea'))
          .filter(el=>!el.disabled && el.offsetParent!==null);
        const idx = focusables.indexOf(e.target);
        if(idx > -1 && idx < focusables.length-1){
          focusables[idx+1].focus();
          if(focusables[idx+1].select) focusables[idx+1].select();
          return;
        }
        if(existing){ doSaveExisting(); return; }
        if(e.shiftKey) doAddAllAndClose();
        else doAddToList();
      });
    }
  });
}

function openDuplicateSummary(bizKey, scopeSalesman, mode){
  const allBiz = getSales(bizKey);
  /* When scoped to one salesman (the only way this is opened today), use
     the exact same entry set as that account's own table — Sales Target
     period-filtered, or Promotional-side-only — so duplicates found here
     always match what's actually visible in that table. */
  let scoped = scopeSalesman ? acctBaseEntries(bizKey, scopeSalesman, mode) : allBiz;
  if(!scopeSalesman && mode==='target'){
    scoped = scoped.filter(e=>inTargetPeriod(bizKey, e));
  }
  const dupIds = computeDuplicateKeys(scoped);
  let dups = scoped.filter(e=>dupIds.has(e.id));
  /* Duplicates of the same memo number are grouped together (one directly
     under the other, e.g. Memo 2550 then its duplicate Memo 2550) rather
     than scattered by date, so a pair is always easy to compare at a glance. */
  dups.sort((a,b)=>{
    const memoCmp = String(a.memo||'').localeCompare(String(b.memo||''), undefined, {numeric:true});
    if(memoCmp!==0) return memoCmp;
    return String(a.date||'').localeCompare(String(b.date||''));
  });
  /* SL matches the exact number shown for this memo in the account's own
     table (chronological position within that account), not just a raw
     index into the business-wide list — scoped-salesman is always how this
     is opened today, with the whole-business case kept only as a fallback. */
  const slMap = scopeSalesman ? acctSlMap(bizKey, scopeSalesman, mode) : null;
  function slFor(e){ return slMap ? (slMap.get(e.id)||'') : allBiz.findIndex(x=>x.id===e.id)+1; }

  const rowsHtml = dups.length ? dups.map(e=>{
    return `<div class="summary-row" data-goto="${e.id}">
      <div class="sr-info"><span>#${slFor(e)}</span><span>${esc(e.date)}</span><span>Memo ${esc(e.memo)}</span>${scopeSalesman?'':`<span>${esc(e.salesman||'—')}</span>`}<span>${fmtMoney(e.total)}</span></div>
      <button class="btn btn-sm btn-danger" data-del-dup="${e.id}" type="button">Delete</button>
    </div>`;
  }).join('') : `<div class="empty-state">No duplicate memo numbers found${scopeSalesman?' for '+esc(scopeSalesman):' for this business'}${mode==='target'?' within the target period ('+esc(targetPeriodLabel(bizKey))+')':''}.</div>`;

  openModal({
    title:'Duplicate Memo Summary — '+bizName(bizKey)+(scopeSalesman?' — '+scopeSalesman:'')+(mode==='target'?' (Target Period)':''), wide:true,
    bodyHtml:`<div class="text-soft" style="font-size:12.5px; margin-bottom:10px;">Rows sharing the same <b>memo number</b> within this account are flagged red in the table — a memo is only ever compared against this same account's own entries, never another salesman's.${mode==='target'?' Only memos within the target period ('+esc(targetPeriodLabel(bizKey))+') are checked here.':''} This usually means the same memo's products were entered as separate memos instead of extra rows in one entry. Click a row below to jump straight to it.</div><div id="dupList">${rowsHtml}</div>`,
    footerHtml:`<button class="btn btn-ghost" id="btnCopyDup" type="button" ${dups.length?'':'disabled'}>⧉ Copy Summary</button><button class="btn btn-primary" data-cancel type="button">Close</button>`,
    onMount(api){
      api.overlay.querySelector('[data-cancel]').onclick = api.close;
      api.overlay.querySelectorAll('[data-goto]').forEach(row=>{
        row.addEventListener('click', (ev)=>{
          if(ev.target.closest('[data-del-dup]')) return;
          const id = row.dataset.goto;
          api.close();
          setTimeout(()=>{
            const tr = document.querySelector(`#salesTbody tr[data-id="${id}"]`);
            if(tr){ tr.scrollIntoView({behavior:'smooth', block:'center'}); tr.classList.add('row-flash'); setTimeout(()=>tr.classList.remove('row-flash'), 2300); }
          }, 60);
        });
      });
      api.overlay.querySelectorAll('[data-del-dup]').forEach(btn=>{
        btn.onclick = (ev)=>{
          ev.stopPropagation();
          const id = btn.dataset.delDup;
          confirmDialog('Delete duplicate entry?','The memo moves to the Recycle Bin and its stock is added back.', ()=>{
            saveSales(bizKey, getSales(bizKey).filter(e=>e.id!==id));
            undoToast('Duplicate entry deleted', _lastTrashId);
            api.close();
            route();
            openDuplicateSummary(bizKey, scopeSalesman, mode);
          });
        };
      });
      const copyBtn = document.getElementById('btnCopyDup');
      if(copyBtn) copyBtn.onclick = ()=>{
        const tsv = 'SL\tDate\tMemo\tTotal Amount\n'+dups.map(e=>{
          return `${slFor(e)}\t${e.date}\t${e.memo}\t${Number(e.total).toFixed(2)}`;
        }).join('\n');
        copyToClipboard(tsv);
      };
      enableEnterNav(api.overlay, ()=>api.close());
    }
  });
}

/* Stats for accountSummaryHtml computed directly from a given (already
   filtered) list of entries, instead of the account's full history — used
   when a filter is currently active in the account view and Summary is
   opened, so the summary matches what's actually on screen. */
function filteredAcctStats(bizKey, name, entries){
  const totalAmt = entries.reduce((a,e)=>a+(Number(e.total)||0),0);
  const promoAmt = entries.reduce((a,e)=>a+entryPromoAmount(bizKey,e),0);
  const target = getTarget(bizKey, name);
  const pct = target ? Math.round(totalAmt/target*100) : 0;
  const promoPct = target ? Math.round(promoAmt/target*100) : 0;
  return {target, total:totalAmt, periodTotal:totalAmt, promo:promoAmt, periodPromo:promoAmt, pct, promoPct, count:entries.length, periodCount:entries.length, ctPromo:entries.reduce((a,e)=>a+entryCtPromo(bizKey,e),0), incentive:calcIncentive(bizKey,{pct, periodTotal:totalAmt, periodPromo:promoAmt})};
}
/* Shared summary block for one salesman: Salesman / Total Sales / Target / Total Promotional Sales + product breakdown.
   hideName: true skips the "Salesman" field in the top grid — used in All Accounts
   Summary, where the salesman's name is already shown once as the block heading
   just above this, so the name previously appeared twice per account.
   entriesOverride: when given (a currently-applied account filter), the
   summary is computed from just those memos instead of the full account —
   and a "Filtered view" badge is shown so it's clear these figures are
   scoped. Clearing the filter and reopening Summary goes back to normal. */
function accountSummaryHtml(bizKey, name, mode, hideName, entriesOverride){
  const isTarget = mode==='target';
  const stats = entriesOverride ? filteredAcctStats(bizKey, name, entriesOverride) : salesmanStats(bizKey, name);
  const breakdown = entriesOverride ? productBreakdownFromEntries(entriesOverride) : productBreakdownForSalesman(bizKey, name, mode);
  const filterBadge = entriesOverride ? `<div class="badge-count" style="margin-bottom:10px; display:inline-block;">Filtered view — ${entriesOverride.length} memo(s) match the current filter</div>` : '';
  const nameField = hideName ? '' : `<div><div class="eyebrow">Salesman</div><div style="font-family:var(--font-display); font-size:18px; color:var(--heading);">${esc(name)}</div></div>`;
  const topRow = isTarget ? `
    <div class="grid grid-4" style="margin-bottom:14px;">
      ${nameField}
      <div><div class="eyebrow">Sales Target</div><div style="font-family:var(--font-display); font-size:18px; color:var(--heading);">${fmtMoney(stats.target)}</div></div>
      <div><div class="eyebrow">Sales Target Achieve</div><div style="font-family:var(--font-display); font-size:18px; color:var(--heading);">${fmtMoney(stats.periodTotal)} <span class="text-soft" style="font-size:12px;">(${stats.pct}%)</span></div></div>
      <div><div class="eyebrow">Promotional Sales Target Achieve</div><div style="font-family:var(--font-display); font-size:18px; color:var(--accent-dark);">${fmtMoney(stats.periodPromo)}</div></div>
    </div>
  ` : `
    <div class="grid grid-3" style="margin-bottom:14px;">
      ${nameField}
      <div><div class="eyebrow">Total Sales (All Time)</div><div style="font-family:var(--font-display); font-size:18px; color:var(--heading);">${fmtMoney(stats.total)}</div></div>
      <div><div class="eyebrow">Total Promotional Sales</div><div style="font-family:var(--font-display); font-size:18px; color:var(--accent-dark);">${fmtMoney(stats.promo)}</div></div>
    </div>
  `;
  return filterBadge + topRow + `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>SL</th><th>Product Name</th><th>Model Number</th><th class="right">Qty</th></tr></thead>
      <tbody>${breakdown.length? breakdown.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(r.productName||'—')}</td><td class="mono">${esc(r.modelNumber||'—')}</td><td class="right mono">${r.qty}</td></tr>`).join('') : `<tr><td colspan="4"><div class="empty-state">No promotional product sales recorded.</div></td></tr>`}</tbody>
    </table></div>`;
}
function openIndividualSummary(bizKey, presetName, mode, entriesOverride){
  mode = mode || 'promo';
  const salesmen = getSalesmen(bizKey);
  /* Keep the filtered memo list for the opened account so Print/PDF from
     this modal uses the same numbers the summary body is showing. */
  const filterForPreset = entriesOverride || null;
  function summaryBodyFor(name){
    if(!name) return `<div class="empty-state">Select a salesman above to view their summary.</div>`;
    return accountSummaryHtml(bizKey, name, mode, false, name===presetName ? filterForPreset : null);
  }
  const initial = presetName || '';
  const bodyHtml = `
    ${presetName ? '' : `<div class="field" style="margin-bottom:14px;"><label>Select Salesman</label>
      <select id="summarySalesmanSel"><option value="">— Select —</option>${salesmen.map(s=>`<option value="${esc(s)}" ${s===initial?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`}
    <div id="summaryBody">${summaryBodyFor(initial)}</div>
  `;
  openModal({
    title:(mode==='target'?'Sales Target Summary — ':'Promotional Sales Summary — ')+bizName(bizKey), wide:true, bodyHtml,

/* sortBy '' keeps the existing (insertion) order; any other value sorts explicitly. */
function sortProducts(list, sortBy, sortDir, bizKey){
  if(!sortBy) return list;
  const dir = sortDir==='desc' ? -1 : 1;
  return list.slice().sort((a,b)=>{
    let cmp = 0;
    switch(sortBy){
      case 'model': cmp = String(a.modelNumber||'').localeCompare(String(b.modelNumber||''), undefined, {numeric:true}); break;
      case 'price': cmp = (Number(a.price)||0) - (Number(b.price)||0); break;
      case 'qty': cmp = (Number(a.quantity)||0) - (Number(b.quantity)||0); break;
      case 'target': cmp = (Number(a.targetQuantity)||0) - (Number(b.targetQuantity)||0); break;
      case 'achieved': cmp = achievedQtyForProduct(bizKey,a) - achievedQtyForProduct(bizKey,b); break;
      case 'promo': cmp = (Number(a.spQty)||0) - (Number(b.spQty)||0); break;
      case 'ct': cmp = (Number(a.ctQty)||0) - (Number(b.ctQty)||0); break;
      case 'name': default: cmp = String(a.productName||'').localeCompare(String(b.productName||'')); break;
    }
    return dir*cmp;
  });
}

    const filtered = getProducts(bizKey).filter(p=>{
      if(pvs.search && !((p.productName+' '+p.modelNumber).toLowerCase().includes(pvs.search.toLowerCase()))) return false;
      if(pvs.fName && !p.productName.toLowerCase().includes(pvs.fName.toLowerCase())) return false;
      if(pvs.fModel && !p.modelNumber.toLowerCase().includes(pvs.fModel.toLowerCase())) return false;
      if(pvs.priceMin!=='' && Number(p.price) < Number(pvs.priceMin)) return false;
      if(pvs.priceMax!=='' && Number(p.price) > Number(pvs.priceMax)) return false;
      if(pvs.qtyMin!=='' && Number(p.quantity) < Number(pvs.qtyMin)) return false;
      if(pvs.qtyMax!=='' && Number(p.quantity) > Number(pvs.qtyMax)) return false;
      if(pvs.targetMin!=='' && Number(p.targetQuantity) < Number(pvs.targetMin)) return false;
      if(pvs.targetMax!=='' && Number(p.targetQuantity) > Number(pvs.targetMax)) return false;
      if(pvs.achievedMin!=='' && achievedQtyForProduct(bizKey,p) < Number(pvs.achievedMin)) return false;
      if(pvs.achievedMax!=='' && achievedQtyForProduct(bizKey,p) > Number(pvs.achievedMax)) return false;
      if(pvs.promoMin!=='' && Number(p.spQty||0) < Number(pvs.promoMin)) return false;
      if(pvs.promoMax!=='' && Number(p.spQty||0) > Number(pvs.promoMax)) return false;
      if(pvs.ctMin!=='' && Number(p.ctQty||0) < Number(pvs.ctMin)) return false;
      if(pvs.ctMax!=='' && Number(p.ctQty||0) > Number(pvs.ctMax)) return false;
      return true;
    });
    return sortProducts(filtered, pvs.sortBy, pvs.sortDir, bizKey);
  }
  function refreshTable(){
    const filtered = currentFiltered();
    const tbody = document.getElementById('productsTbody');
    tbody.innerHTML = filtered.length===0
      ? `<tr><td colspan="11">${emptyState('📦', 'No products yet', `Click “+ Add Product” to build your product master for ${esc(bizName(bizKey))}.`)}</td></tr>`
      : filtered.map((p, idx)=>{
          const ach = achievedQtyForProduct(bizKey, p);
          return `<tr data-id="${p.id}">
            <td><input type="checkbox" class="rowSel" data-id="${p.id}" ${pvs.selected.has(p.id)?'checked':''}/></td>
            <td class="mono">${idx+1}</td>
            <td>${esc(p.productName)}</td>
            <td class="mono">${esc(p.modelNumber)}</td>
            <td class="right mono">${fmtMoney(p.price)}</td>
            <td class="right mono">${p.quantity}</td>
            <td class="right mono">${p.targetQuantity}</td>
            <td class="right mono">${ach}</td>
            <td class="right mono">${fmtMoney(p.spQty||0)}</td>
            <td class="right mono">${fmtMoney(p.ctQty||0)}</td>
            <td><button class="btn btn-sm btn-ghost" data-edit="${p.id}" type="button">Edit</button> <button class="btn btn-sm btn-danger" data-del="${p.id}" type="button">Delete</button></td>
          </tr>`;
        }).join('');
    tbody.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProductModal(bizKey, b.dataset.edit));
    tbody.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      confirmDialog('Delete this product?','The product moves to the Recycle Bin (kept 60 days, with an Undo right after).', ()=>{
        saveProducts(bizKey, getProducts(bizKey).filter(p=>p.id!==b.dataset.del));
        undoToast('Product deleted', _lastTrashId); refreshTable();
      });
    });
    tbody.querySelectorAll('.rowSel').forEach(cb=>cb.onchange=()=>{ cb.checked ? pvs.selected.add(cb.dataset.id) : pvs.selected.delete(cb.dataset.id); });
    const selAll = document.getElementById('selAll');
    selAll.onchange = (e)=>{ filtered.forEach(p=> e.target.checked? pvs.selected.add(p.id) : pvs.selected.delete(p.id)); refreshTable(); };
  }
  refreshTable();

  document.getElementById('btnAdd').onclick = ()=>openProductModal(bizKey);
  document.getElementById('btnPrint').onclick = ()=>printProductsTable(bizKey, currentFiltered());
  document.getElementById('btnExcel').onclick = ()=>exportProductsExcel(bizKey, currentFiltered());
  document.getElementById('btnSaveAll').onclick = ()=>toast('Product data saved');
  document.getElementById('btnClear').onclick = ()=>{
    confirmDialog(`Clear all product details for ${esc(bizName(bizKey))}?`, 'Every product moves to the Recycle Bin, where you can restore it.', ()=>{
      saveProducts(bizKey, [], {label:'Cleared all products'}); undoToast('Product data cleared', _lastTrashId); renderProductsView(bizKey);
    });
  };
  document.getElementById('btnTransfer').onclick = ()=>openDataTransferModal(bizKey, pvs);
  document.getElementById('btnFilter').onclick = ()=>{ pvs.filterOpen=!pvs.filterOpen; document.getElementById('filterPanel').classList.toggle('open', pvs.filterOpen); };
  function readPVSFields(){
    pvs.fName = document.getElementById('fName').value;
    pvs.fModel = document.getElementById('fModel').value;
    pvs.priceMin = document.getElementById('fPriceMin').value;
    pvs.priceMax = document.getElementById('fPriceMax').value;
    pvs.qtyMin = document.getElementById('fQtyMin').value;
    pvs.qtyMax = document.getElementById('fQtyMax').value;
    pvs.targetMin = document.getElementById('fTargetMin').value;
    pvs.targetMax = document.getElementById('fTargetMax').value;
    pvs.achievedMin = document.getElementById('fAchievedMin').value;
    pvs.achievedMax = document.getElementById('fAchievedMax').value;
    pvs.promoMin = document.getElementById('fPromoMin').value;
    pvs.promoMax = document.getElementById('fPromoMax').value;
    pvs.ctMin = document.getElementById('fCtMin').value;
    pvs.ctMax = document.getElementById('fCtMax').value;
    pvs.sortBy = document.getElementById('fSortBy').value;
    pvs.sortDir = document.getElementById('fSortDir').value;
  }
  document.getElementById('btnApplyFilter').onclick = ()=>{
    readPVSFields();
    pvs.filterOpen = true;
    refreshTable();
  };
  document.getElementById('btnSaveFilter').onclick = ()=>{
    readPVSFields();
    savePVSFilter(bizKey, pvs);
    pvs.filterOpen = true;
    refreshTable();
    toast('Filter saved — it will still be set next time you open Product Details');
  };
  document.getElementById('btnResetFilter').onclick = ()=>{
    Object.assign(pvs, blankPVS());
    savePVSFilter(bizKey, pvs);
    pvs.filterOpen = true;
    renderProductsView(bizKey);
  };
  /* Search updates only the table body, in place, so typing never loses focus. */
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', ()=>{ pvs.search = searchInput.value; refreshTable(); });
  searchInput.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ searchInput.value=''; pvs.search=''; refreshTable(); }
  });

  document.getElementById('btnDeleteSel').onclick = ()=>{
    if(pvs.selected.size===0){ toast('No rows selected','danger'); return; }
    confirmDialog(`Delete ${pvs.selected.size} selected product(s)?`, 'They move to the Recycle Bin, where you can restore them.', ()=>{
      saveProducts(bizKey, getProducts(bizKey).filter(p=>!pvs.selected.has(p.id)), {label:'Deleted selected products'});
      const tid = _lastTrashId; pvs.selected.clear(); undoToast('Selected products deleted', tid); renderProductsView(bizKey);
    });
  };
}

function openProductModal(bizKey, productId){
  const existing = productId ? getProducts(bizKey).find(p=>p.id===productId) : null;
  const productNames = distinctProductNames(getProducts(bizKey));
  /* New (non-edit) products are staged in a local batch first — nothing is
     written to storage until "Add" is pressed, so everything you build up in
     one sitting is saved together in a single action. */
  let staged = [];

  function fieldsHtml(){
    return `
      <div class="field-row">
        <div class="field"><label>Product Name</label><input type="text" id="pName" list="productNameList"/>
          <datalist id="productNameList">${productNames.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
        </div>
        <div class="field"><label>Model Number</label><input type="text" id="pModel" class="mono"/></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Price</label><input type="number" id="pPrice" min="0" step="0.01" value="0"/></div>
        <div class="field"><label>Quantity (stock)</label><input type="number" id="pQty" min="0" step="1" value="0"/></div>
        <div class="field"><label>Target Quantity</label><input type="number" id="pTarget" min="0" step="1" value="0"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Promo Amount per Unit — Salesperson (৳)</label><input type="number" id="pSp" min="0" step="0.01" value="0"/><span class="hint">Credited automatically to a salesman's promotional sales total for every unit of this product they sell.</span></div>
        <div class="field"><label>Promo Amount per Unit — Contractor (৳)</label><input type="number" id="pCt" min="0" step="0.01" value="0"/><span class="hint">Credited to the contractor named on the memo, for every unit of this product sold.</span></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Low-stock alert at (qty)</label><input type="number" id="pMin" min="0" step="1" value="0"/><span class="hint">0 = use the default level from Settings.</span></div>
        <div></div>
      </div>`;
  }
  function fillForm(vals){
    document.getElementById('pName').value = vals.productName||'';
    document.getElementById('pModel').value = vals.modelNumber||'';
    document.getElementById('pPrice').value = vals.price??0;
    document.getElementById('pQty').value = vals.quantity??0;
    document.getElementById('pTarget').value = vals.targetQuantity??0;
    document.getElementById('pSp').value = vals.spQty??0;
    document.getElementById('pCt').value = vals.ctQty??0;
    { const pm = document.getElementById('pMin'); if(pm) pm.value = vals.minStock??0; }
  }

  function stagedListHtml(){
    if(staged.length===0) return '';
    return `<div class="field">
      <label>Staged Products <span class="text-soft" style="font-weight:400;">(${staged.length} product${staged.length===1?'':'s'} ready — press "Add" below to save ${staged.length===1?'it':'them all'})</span></label>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Product Name</th><th>Model No.</th><th class="right">Price</th><th class="right">Qty</th><th>Actions</th></tr></thead>
        <tbody>${staged.map(s=>`<tr>
          <td>${esc(s.productName)}</td><td class="mono">${esc(s.modelNumber)}</td>
          <td class="right mono">${fmtMoney(s.price)}</td><td class="right mono">${s.quantity}</td>
          <td><button class="btn btn-sm btn-ghost" data-edit-staged="${s._stagedId}" type="button">Edit</button> <button class="btn btn-sm btn-danger" data-del-staged="${s._stagedId}" type="button">Delete</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  const bodyHtml = `<form id="prodForm" onsubmit="return false;">${fieldsHtml()}</form><div id="stagedWrap">${stagedListHtml()}</div>`;
  const primaryLabel = existing ? 'Save Changes' : '+ Add to List';
  openModal({
    title: existing ? 'Edit Product' : 'Add Product — '+bizName(bizKey),
    bodyHtml,
    footerHtml: existing
      ? `<button class="btn btn-ghost" data-cancel type="button">Cancel <span class="kbd">Esc</span></button><button class="btn btn-primary" id="btnSaveProd" type="button">${primaryLabel} <span class="kbd">Enter</span></button>`
      : `<button class="btn btn-ghost" data-cancel type="button">Cancel <span class="kbd">Esc</span></button><button class="btn" id="btnSaveAddProd" type="button">${primaryLabel} <span class="kbd">Enter</span></button><button class="btn btn-primary" id="btnAddAllProd" type="button">✔ Add <span class="kbd">Shift+Enter</span></button>`,
    onMount(api){
      if(existing) fillForm(existing);
      api.overlay.querySelector('[data-cancel]').onclick = api.close;

      function readForm(){
        const productName = document.getElementById('pName').value.trim();
        const modelNumber = document.getElementById('pModel').value.trim();
        if(!productName || !modelNumber){ toast('Product Name and Model Number are required','danger'); return null; }
        return {
          productName, modelNumber,
          price: Number(document.getElementById('pPrice').value)||0,
          quantity: Number(document.getElementById('pQty').value)||0,
          targetQuantity: Number(document.getElementById('pTarget').value)||0,
          spQty: Number(document.getElementById('pSp').value)||0,
          ctQty: Number(document.getElementById('pCt').value)||0,
          minStock: Number(document.getElementById('pMin').value)||0,
        };
      }
      function resetFormForNext(){
        fillForm({});
        document.getElementById('pName').focus();
      }
      function renderStaged(){
        document.getElementById('stagedWrap').innerHTML = stagedListHtml();
        wireStagedButtons();
      }
      function wireStagedButtons(){
        api.overlay.querySelectorAll('[data-edit-staged]').forEach(b=>{
          b.onclick = ()=>{
            const idx = staged.findIndex(s=>s._stagedId===b.dataset.editStaged);
            if(idx<0) return;
            const s = staged[idx];
            staged.splice(idx,1);
            fillForm(s);
            renderStaged();
            document.getElementById('pName').focus();
            toast('Loaded back into the form — edit and Add to List again');
          };
        });
        api.overlay.querySelectorAll('[data-del-staged]').forEach(b=>{
          b.onclick = ()=>{ staged = staged.filter(s=>s._stagedId!==b.dataset.delStaged); renderStaged(); };
        });
      }
      wireStagedButtons();

      function doSaveExisting(){
        const data = readForm(); if(!data) return;
        const rec = { id: existing.id, ...data };
        const list = getProducts(bizKey);
        list[list.findIndex(p=>p.id===existing.id)] = rec;
        saveProducts(bizKey, list);
        toast('Product updated');
        api.close();
        renderProductsView(bizKey);
      }
      function doAddToList(){
        const data = readForm(); if(!data) return;
        staged.push({...data, _stagedId:uid()});
        toast('Added to list — keep entering, or press Add to save all');
        resetFormForNext();
        renderStaged();
      }
      function doAddAllAndClose(){
        const nameTyped = document.getElementById('pName').value.trim();
        if(nameTyped){
          const data = readForm();
          if(!data) return;
          staged.push({...data, _stagedId:uid()});
        }
        if(staged.length===0){ toast('Add at least one product first','danger'); return; }
        const list = getProducts(bizKey);
        staged.forEach(s=>{ list.push({ id: uid(), productName:s.productName, modelNumber:s.modelNumber, price:s.price, quantity:s.quantity, targetQuantity:s.targetQuantity, spQty:s.spQty, ctQty:s.ctQty, minStock:s.minStock||0 }); });
        saveProducts(bizKey, list);
        toast(staged.length===1 ? 'Product added' : staged.length+' products added');
        api.close();
        renderProductsView(bizKey);
      }

      if(existing){
        document.getElementById('btnSaveProd').onclick = doSaveExisting;
      } else {
        document.getElementById('btnSaveAddProd').onclick = doAddToList;
        document.getElementById('btnAddAllProd').onclick = doAddAllAndClose;
      }

      /* Same rationale as the sales entry modal: Enter stages the product and
         keeps the batch going; Shift+Enter (or the Add button) commits
         everything. Editing a single existing product just saves on Enter. */
      api.overlay.addEventListener('keydown', (e)=>{
        if(e.key!=='Enter') return;
        const tag = e.target.tagName.toLowerCase();
        if(tag==='textarea' || tag==='button') return;
        if(e.target.dataset && e.target.dataset.noenter) return;
        e.preventDefault();
        const focusables = Array.from(api.overlay.querySelectorAll('input, select, textarea'))
          .filter(el=>!el.disabled && el.offsetParent!==null);
        const idx = focusables.indexOf(e.target);
        if(idx > -1 && idx < focusables.length-1){
          focusables[idx+1].focus();
          if(focusables[idx+1].select) focusables[idx+1].select();
          return;
        }
        if(existing){ doSaveExisting(); return; }
        if(e.shiftKey) doAddAllAndClose();
        else doAddToList();
      });
    }
  });
}

function openDataTransferModal(bizKey, pvs){
  const others = BUSINESSES.filter(b=>b.key!==bizKey);
  const scopeCount = pvs.selected.size;
  const bodyHtml = `
    <div class="field"><label>Destination business</label><select id="destBiz">${others.map(b=>`<option value="${b.key}">${esc(b.name)}</option>`).join('')}</select></div>
    <div class="field">
      <label>Scope</label>
      <div class="checkbox-row"><input type="radio" name="scope" value="selected" id="scopeSel" ${scopeCount?'checked':'disabled'}/><label for="scopeSel" style="margin:0;">Selected rows only (${scopeCount})</label></div>
      <div class="checkbox-row" style="margin-top:6px;"><input type="radio" name="scope" value="all" id="scopeAll" ${scopeCount?'':'checked'}/><label for="scopeAll" style="margin:0;">All products in ${esc(bizName(bizKey))}</label></div>
    </div>
    <div class="field">
      <label>Mode</label>
      <div class="checkbox-row"><input type="radio" name="mode" value="move" id="modeMove" checked/><label for="modeMove" style="margin:0;">Move (remove from source)</label></div>
      <div class="checkbox-row" style="margin-top:6px;"><input type="radio" name="mode" value="copy" id="modeCopy"/><label for="modeCopy" style="margin:0;">Copy (keep in source)</label></div>
    </div>`;
  openModal({
    title:'Data Transfer — from '+bizName(bizKey), bodyHtml,
    footerHtml:`<button class="btn btn-ghost" data-cancel type="button">Cancel</button><button class="btn btn-accent" id="btnDoTransfer" type="button">Transfer</button>`,
    onMount(api){
      api.overlay.querySelector('[data-cancel]').onclick = api.close;
      function doTransfer(){
        const dest = document.getElementById('destBiz').value;
        const scope = api.overlay.querySelector('input[name=scope]:checked').value;
        const mode = api.overlay.querySelector('input[name=mode]:checked').value;
        const source = getProducts(bizKey);
        const toMove = scope==='selected' ? source.filter(p=>pvs.selected.has(p.id)) : source.slice();
        if(toMove.length===0){ toast('Nothing to transfer','danger'); return; }
        const copies = toMove.map(p=>({...p, id:uid()}));
        saveProducts(dest, getProducts(dest).concat(copies), {silent:true});
        if(mode==='move'){
          const ids = new Set(toMove.map(p=>p.id));
          saveProducts(bizKey, source.filter(p=>!ids.has(p.id)), {silent:true, noTrash:true});
          auditAdd([{act:'transfer', biz:bizKey, txt:toMove.length+' product(s) moved to '+bizName(dest)}]);
        }
        pvs.selected.clear();
        toast(`${toMove.length} product(s) ${mode==='move'?'moved':'copied'} to ${bizName(dest)}`);
        api.close();
        renderProductsView(bizKey);
      }
      document.getElementById('btnDoTransfer').onclick = doTransfer;
      enableEnterNav(api.overlay, doTransfer);
    }
  });
}

/* Moves or copies specific memos from one salesman's account to another
   salesman in the SAME business — for correcting a memo entered under the
   wrong account, without deleting and retyping it. Scope can be the
   checked rows (by SL), the account's current filter (by memo no./date
   range — set via the Filter panel before opening this), or every memo in
   the account. Only the "salesman" field changes; the memo's date, memo
   number, products and totals all stay exactly as entered. */
function openEntryTransferModal(bizKey, name, mode, selectedIds, filteredEntries, filterIsActive, onDone){
  const others = getSalesmen(bizKey).filter(n=>n!==name);
  const allCount = acctBaseEntries(bizKey, name, mode).length;
  const selCount = selectedIds.size;
  const filteredCount = filteredEntries.length;
  if(others.length===0){
    openModal({ title:'Transfer Entries — '+esc(name), bodyHtml:`<div class="empty-state">There's no other salesman account in ${esc(bizName(bizKey))} to transfer entries to yet — add one under Accounts first.</div>`, footerHtml:`<button class="btn btn-ghost" data-cancel type="button">Close</button>`, onMount(api){ api.overlay.querySelector('[data-cancel]').onclick = api.close; } });
    return;
  }
  const bodyHtml = `
    <div class="field"><label>Destination salesman (in ${esc(bizName(bizKey))})</label><select id="destSalesman">${others.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div>
    <div class="field">
      <label>Which entries</label>
      <div class="checkbox-row"><input type="radio" name="scope" value="selected" id="scopeSel" ${selCount?'checked':'disabled'}/><label for="scopeSel" style="margin:0;">Selected rows only (${selCount}) — by SL, checked in the table</label></div>
      <div class="checkbox-row" style="margin-top:6px;"><input type="radio" name="scope" value="filtered" id="scopeFiltered" ${!selCount && filterIsActive ? 'checked' : ''} ${filterIsActive?'':'disabled'}/><label for="scopeFiltered" style="margin:0;">Currently filtered entries (${filteredCount}) — by memo no./date, set via Filter</label></div>
      <div class="checkbox-row" style="margin-top:6px;"><input type="radio" name="scope" value="all" id="scopeAll" ${!selCount && !filterIsActive ? 'checked' : ''}/><label for="scopeAll" style="margin:0;">Every entry in ${esc(name)}'s account (${allCount})</label></div>
    </div>
    <div class="field">
      <label>Mode</label>
      <div class="checkbox-row"><input type="radio" name="mode" value="move" id="modeMove" checked/><label for="modeMove" style="margin:0;">Move (remove from ${esc(name)})</label></div>
      <div class="checkbox-row" style="margin-top:6px;"><input type="radio" name="mode" value="copy" id="modeCopy"/><label for="modeCopy" style="margin:0;">Copy (keep in ${esc(name)} too)</label></div>
    </div>
    <p class="hint" style="margin-top:10px;">Only the salesman changes — date, memo number, products and totals all stay exactly as entered.</p>`;
  openModal({
    title:'Transfer Entries — from '+esc(name), bodyHtml,
    footerHtml:`<button class="btn btn-ghost" data-cancel type="button">Cancel</button><button class="btn btn-accent" id="btnDoEntryTransfer" type="button">Transfer</button>`,
    onMount(api){
      api.overlay.querySelector('[data-cancel]').onclick = api.close;
      function doTransfer(){
        const dest = document.getElementById('destSalesman').value;
        const scope = api.overlay.querySelector('input[name=scope]:checked').value;
        const xferMode = api.overlay.querySelector('input[name=mode]:checked').value;
        const source = getSales(bizKey);
        let toMove;
        if(scope==='selected') toMove = source.filter(e=>selectedIds.has(e.id));
        else if(scope==='filtered') toMove = filteredEntries.slice();
        else toMove = acctBaseEntries(bizKey, name, mode);
        if(toMove.length===0){ toast('Nothing to transfer','danger'); return; }
        const moveIds = new Set(toMove.map(e=>e.id));
        let updated;
        if(xferMode==='move'){
          updated = source.map(e=>moveIds.has(e.id) ? {...e, salesman:dest} : e);
        } else {
          const copies = toMove.map(e=>({...e, id:uid(), salesman:dest}));
          updated = source.concat(copies);
        }
        saveSales(bizKey, updated, {noStock:true, silent:true});
        auditAdd([{act:'transfer', biz:bizKey, txt:toMove.length+' memo(s) '+(xferMode==='move'?'moved':'copied')+' from '+name+' to '+dest}]);
        selectedIds.clear();
        toast(`${toMove.length} entry(ies) ${xferMode==='move'?'moved':'copied'} to ${esc(dest)}`);
        api.close();
        if(onDone) onDone(); else renderSalesAccountView(bizKey, name, mode);
      }
      document.getElementById('btnDoEntryTransfer').onclick = doTransfer;
      enableEnterNav(api.overlay, doTransfer);
    }
  });
}

function printProductsTable(bizKey, rows){
  const headers = ['SL','Product Name','Model No.','Price','Qty','Target Qty','Achieved','Promo ৳/unit (Salesperson)','Promo ৳/unit (Contractor)'];
  const body = rows.map((p,i)=>[i+1, p.productName, p.modelNumber, Number(p.price).toFixed(2), p.quantity, p.targetQuantity, achievedQtyForProduct(bizKey,p), Number(p.spQty||0).toFixed(2), Number(p.ctQty||0).toFixed(2)]);
  pdfFromRows('Product Details — '+bizName(bizKey), headers, body, bizName(bizKey)+'_products');
}
function exportProductsExcel(bizKey, rows){
  const headers = ['SL','Product Name','Model No.','Price','Qty','Target Qty','Achieved','Promo ৳/unit (Salesperson)','Promo ৳/unit (Contractor)'];
  const body = rows.map((p,i)=>[i+1, p.productName, p.modelNumber, Number(p.price), p.quantity, p.targetQuantity, achievedQtyForProduct(bizKey,p), Number(p.spQty||0), p.ctQty||0]);

/* ---------------- Summary ---------------- */
function renderSummaryTarget(){
  setTitle('Summary — Sales Target');
  const f = getRSFilter();
  const df = f.dateFrom || '', dt = f.dateTo || '';

  /* Master leaderboard — every salesman × business account with actual
     Sales Target activity ($0 accounts are left out, see reportableAccountStats). */
  let leaderboard = [];
  BUSINESSES.forEach(b=>{
    reportableAccountStats(b.key, 'target', df, dt).forEach(s=>{
      leaderboard.push({biz:b.key, bizName:b.name, ...s});
    });
  });
  leaderboard.sort((a,c)=>c.periodTotal-a.periodTotal);
  const grand = leaderboard.reduce((a,r)=>({periodTotal:a.periodTotal+r.periodTotal, target:a.target+r.target, periodPromo:a.periodPromo+r.periodPromo, incentive:a.incentive+((r.incentive&&r.incentive.amount)||0)}), {periodTotal:0, target:0, periodPromo:0, incentive:0});
  const grandPct = grand.target ? Math.round(grand.periodTotal/grand.target*100) : 0;

  let sections = '', allDupRows = [];
  BUSINESSES.forEach(b=>{
    const sales = getSales(b.key).filter(e=>inDateRange(e, df, dt));
    if(sales.length===0) return;
    /* Duplicate detection stays scoped to each salesman's own account — one
       account's memo numbers are never compared against another account's. */
    let dups = [];
    getSalesmen(b.key).forEach(name=>{
      const acctEntries = sales.filter(e=>e.salesman===name);
      const dupIds = computeDuplicateKeys(acctEntries);
      dups.push(...acctEntries.filter(e=>dupIds.has(e.id)));
    });
    dups.forEach(e=>allDupRows.push({biz:b.name, salesman:e.salesman, date:e.date, memo:e.memo, total:e.total}));
    sections += `<div class="card">
      <div class="section-head"><h2>${esc(b.name)}</h2><span class="badge-count">${sales.length} memo(s) • ${dups.length} duplicate(s)</span></div>
      <div class="grid grid-3">
        <div><div class="eyebrow">Total Sales</div><div style="font-family:var(--font-display); font-size:20px; color:var(--heading);">${fmtMoney(sales.reduce((a,e)=>a+(Number(e.total)||0),0))}</div></div>
        <div><div class="eyebrow">Memos</div><div style="font-family:var(--font-display); font-size:20px; color:var(--heading);">${sales.length}</div></div>
        <div><div class="eyebrow">Duplicates</div><div style="font-family:var(--font-display); font-size:20px; color:var(--coral);">${dups.length}</div></div>
      </div>
    </div>`;
  });

  const view = document.getElementById('view');
  view.innerHTML = rsFilterBarHtml() + `
    <div class="toolbar"><button class="btn btn-primary" id="btnPrintSummary" type="button">🖨 Print Complete Summary (PDF)</button><button class="btn btn-ghost" id="btnCopySummary" type="button">⧉ Copy Duplicate List</button><span class="spacer"></span></div>

    <div class="card">
      <div class="section-head"><h2>Complete Summary — All Businesses &amp; Accounts</h2><span class="badge-count">${leaderboard.length} account(s)</span></div>
      <p class="text-soft" style="font-size:12.5px; margin:-6px 0 10px;">Sales Target Achieve, Target and Achieve % are based on the total sales amount within each business's own target period (set individually per business under Settings — shown in the Target Period column below). Promo Target Achieve shows just the promotional value of those same period memos. Accounts with $0 Sales Target Achieve are left out.</p>
      <div class="grid grid-4" style="margin-bottom:14px;">
        <div><div class="eyebrow">Combined Sales Target Achieve</div><div style="font-family:var(--font-display); font-size:19px; color:var(--heading);">${fmtMoney(grand.periodTotal)}</div></div>
        <div><div class="eyebrow">Combined Target</div><div style="font-family:var(--font-display); font-size:19px; color:var(--heading);">${fmtMoney(grand.target)}</div></div>
        <div><div class="eyebrow">Combined Promo Target Achieve</div><div style="font-family:var(--font-display); font-size:19px; color:var(--accent-dark);">${fmtMoney(grand.periodPromo)}</div></div>
        <div><div class="eyebrow">Overall Achieve %</div><div style="font-family:var(--font-display); font-size:19px; color:var(--heading);">${grandPct}%</div></div>
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Rank</th><th>Business</th><th>Salesman</th><th>Target Period</th><th class="right">Sales Target Achieve</th><th class="right">Target</th><th class="right">Promo Target Achieve</th><th class="right">Achieve %</th>${incentiveOn()?'<th class="right">Incentive</th>':''}<th>Action</th></tr></thead>
        <tbody id="leaderboardTbody">
          ${leaderboard.length ? leaderboard.map((r,i)=>`<tr>
              <td class="mono">${i+1}</td>
              <td>${esc(r.bizName)}</td>

              <td class="right mono">${fmtMoney(r.target)}</td>
              <td class="right mono">${fmtMoney(r.periodPromo)}</td>
              <td class="right mono">${r.pct}%</td>
              ${incentiveOn()?`<td class="right mono">${esc(incText(r.incentive))}</td>`:''}
              <td>
                <button class="btn btn-sm btn-ghost" data-lb-open="${r.biz}||${acctSlug(r.name)}" type="button">Open</button>
                <button class="btn btn-sm btn-ghost" data-lb-edit="${r.biz}||${acctSlug(r.name)}" type="button">Edit Target</button>
                <button class="btn btn-sm btn-danger" data-lb-del="${r.biz}||${acctSlug(r.name)}" type="button">Delete</button>
              </td>
            </tr>`).join('') : `<tr><td colspan="${incentiveOn()?10:9}">${emptyState('🎯', 'No Sales Target activity yet', 'Accounts with activity will appear here.')}</td></tr>`}
          ${leaderboard.length ? `<tr style="font-weight:700; background:var(--paper);"><td></td><td></td><td>Grand Total</td><td></td><td class="right mono">${fmtMoney(grand.periodTotal)}</td><td class="right mono">${fmtMoney(grand.target)}</td><td class="right mono">${fmtMoney(grand.periodPromo)}</td><td class="right mono">${grandPct}%</td>${incentiveOn()?`<td class="right mono">${fmtMoney(grand.incentive)}</td>`:''}<td></td></tr>` : ''}
        </tbody>
      </table></div>

    ${sections}
    <div class="card">
      <div class="section-head"><h2>All Duplicate Memos</h2></div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>SL</th><th>Business</th><th>Salesman</th><th>Date</th><th>Memo No.</th><th class="right">Total Amount</th></tr></thead>
        <tbody>${allDupRows.length? allDupRows.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(r.biz)}</td><td>${esc(r.salesman)}</td><td class="mono">${esc(r.date)}</td><td class="mono">${esc(r.memo)}</td><td class="right mono">${fmtMoney(r.total)}</td></tr>`).join('') : `<tr><td colspan="6">${emptyState('✅', 'No duplicate memos', 'All memo numbers look unique across accounts.')}</td></tr>`}</tbody>

    </div>`;

  wireRSFilter(()=>renderSummaryTarget());

    const headers = ['Rank','Business','Salesman','Target Period','Sales Target Achieve','Target','Promo Target Achieve','Achieve %'].concat(incentiveOn()?['Incentive']:[]);
    const body = leaderboard.map((r,i)=>[i+1, r.bizName, r.name, targetPeriodLabel(r.biz), fmtMoney(r.periodTotal), fmtMoney(r.target), fmtMoney(r.periodPromo), r.pct+'%'].concat(incentiveOn()?[incText(r.incentive)]:[]));
    body.push(['','','Grand Total','', fmtMoney(grand.periodTotal), fmtMoney(grand.target), fmtMoney(grand.periodPromo), grandPct+'%'].concat(incentiveOn()?[fmtMoney(grand.incentive)]:[]));

    pdfFromRows('Complete Summary — Sales Target — All Businesses & Accounts'+rangeNote, headers, body, 'promaxis_target_summary');

  document.getElementById('btnCopySummary').onclick = ()=>{
    copyToClipboard('SL\tBusiness\tSalesman\tDate\tMemo\tTotal Amount\n'+allDupRows.map((r,i)=>`${i+1}\t${r.biz}\t${r.salesman}\t${r.date}\t${r.memo}\t${Number(r.total).toFixed(2)}`).join('\n'));

}

/* ---------------- Backup ---------------- */
function collectFullState(){
  const state = {version:APP_VERSION, exportedAt:new Date().toISOString(), settings:getSettings(), contractors:getContractors(), businesses:{}, extra:{}};
  BUSINESSES.forEach(b=>{ state.businesses[b.key] = {sales:getSales(b.key), products:getProducts(b.key), salesmen:getSalesmen(b.key), targets:getTargets(b.key), sessionPeriod:getSessionPeriod(b.key)}; });
  /* everything else worth keeping: phones, stock/incentive settings, templates, business names & logos, recycle bin, audit log */
  const STRUCT = /^(sales_|products_|salesmen_|targets_|session_)/;
  Object.keys(_cache).forEach(k=>{
    if(isLocalOnlyKey(k) || STRUCT.test(k) || k==='settings' || k==='contractors' || k==='tomb' || k==='app_auth') return;
    state.extra[k] = _cache[k];
  });
  return state;
}
function restoreFullState(state){
  if(!state || !state.businesses) throw new Error('Invalid backup file');
  saveSettings(state.settings || getSettings());
  saveContractors(state.contractors || []);
  BUSINESSES.forEach(b=>{
    const d = state.businesses[b.key] || {};
    /* whatever is on screen now goes to the Recycle Bin first, so a restore can always be undone */
    saveSales(b.key, d.sales || [], {noStock:true, silent:true, label:'Replaced by a backup restore'});
    saveProducts(b.key, d.products || [], {silent:true, label:'Replaced by a backup restore'});
    saveSalesmen(b.key, d.salesmen || (state.salesmen||[]));
    if(d.targets) Store.set('targets_'+b.key, d.targets);
    if(d.sessionPeriod) saveSessionPeriod(b.key, d.sessionPeriod.from, d.sessionPeriod.to);
  });
  if(state.extra){
    Object.keys(state.extra).forEach(k=>{
      if(isLocalOnlyKey(k) || k==='trash' || k==='audit') return;   /* keep today's bin and log; a backup must not wipe them */
      Store.set(k, state.extra[k]);
    });
  }
  auditAdd([{act:'restore', txt:'Data restored from a backup'}]);
  applyTheme(getSettings());
}

/* Excel re-import: parse rows exported by this app's own Excel buttons. */
function parseProductsFromSheet(rows){
  return (rows||[]).slice(1)
    .filter(r=>r && (r[1]||r[2]))
    .map(r=>({
      productName: String(r[1]||'').trim(),
      modelNumber: String(r[2]||'').trim(),
      price: Number(r[3])||0,
      quantity: Number(r[4])||0,
      targetQuantity: Number(r[5])||0,
      spQty: Number(r[7])||0,
      ctQty: Number(r[8])||0,
    }))
    .filter(p=>p.productName && p.modelNumber);
}
function parseSalesFromSheet(rows, bizKey){
  const products = getProducts(bizKey);
  return (rows||[]).slice(1)
    .filter(r=>r && r[1] && r[2])
    .map(r=>{
      const date = String(r[1]||'').trim();
      const memo = String(r[2]||'').trim();
      const productsStr = String(r[3]||'').trim();
      const total = Number(r[4])||0;
      const items = productsStr ? productsStr.split(',').map(s=>s.trim()).filter(Boolean).map(chunk=>{
        const m = chunk.match(/^(.*)\s+x(\d+(?:\.\d+)?)$/i);
        const pname = m ? m[1].trim() : chunk;
        const qty = m ? Number(m[2]) : 0;
        const matches = products.filter(p=>p.productName===pname);
        const modelNumber = matches.length===1 ? matches[0].modelNumber : '';
        return {id:uid(), productName:pname, modelNumber, qty};
      }) : [];
      return {id:uid(), date, memo, total, items};
    })
    .filter(e=>e.date && e.memo);
}

function reportPreviewHtml(){
  return BUSINESSES.map(b=>{

    const rows = stats.map((s,i)=>[i+1, b.name, s.name, fmtMoney(s.periodTotal), fmtMoney(s.target), fmtMoney(s.periodPromo), s.pct+'%'].concat(incentiveOn()?[incText(s.incentive)]:[]));

  }).join('');

function summaryLeaderboardAndDups(){
  let leaderboard = [];
  BUSINESSES.forEach(b=> allAccountStats(b.key).forEach(s=> leaderboard.push({biz:b.key, bizName:b.name, ...s})));
  leaderboard.sort((a,c)=>c.periodTotal-a.periodTotal);
  let allDup = [];
  BUSINESSES.forEach(b=>{
    const sales = getSales(b.key);
    getSalesmen(b.key).forEach(name=>{
      const acctEntries = sales.filter(e=>e.salesman===name);
      const dupIds = computeDuplicateKeys(acctEntries);
      acctEntries.filter(e=>dupIds.has(e.id)).forEach(e=>allDup.push([b.name, name, e.date, e.memo, fmtMoney(e.total)]));
    });
  });
  return {leaderboard, allDup};
}
function summaryPreviewHtml(){
  const {leaderboard, allDup} = summaryLeaderboardAndDups();
  const rows = leaderboard.map((r,i)=>[i+1, r.bizName, r.name, targetPeriodLabel(r.biz), fmtMoney(r.periodTotal), fmtMoney(r.target), fmtMoney(r.periodPromo), r.pct+'%'].concat(incentiveOn()?[incText(r.incentive)]:[]));

    tableHtml(['Business','Salesman','Date','Memo No.','Total Amount'], allDup);
}
